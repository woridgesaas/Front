<div class="container min-vh-100 d-flex align-items-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-8 col-lg-6 text-center">
      <div class="mb-3">
        <img
          src="assets/favicon_io/big-logo-nobg.png"
          alt="logo"
          class="img-fluid logo"
        />
      </div>

      <div class="error-images mb-4">
        <img
          src="assets/img/bg/error-404.svg"
          alt="404 error"
          class="img-fluid error-img"
        />
      </div>

      <h1 class="mb-1">Oups, une erreur s’est produite</h1>
      <p class="fs-14 text-muted ">
        Erreur 404 – Page introuvable.<br />
        La page demandée est introuvable ou a été déplacée.
      </p>

      <a [routerLink]="routes.index" class="btn btn-primary px-4 py-2">
        <i class="ti ti-arrow-left me-2"></i>
        Retour au tableau de bord
      </a>
    </div>
  </div>
</div>
