<div class="container min-vh-100 d-flex align-items-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-8 col-lg-6 text-center">

      <!-- Logo -->
      <div class="mb-1">
        <img
          src="assets/favicon_io/big-logo-nobg.png"
          alt="logo Woridge"
          class="img-fluid logo"
        />
      </div>

      <!-- Illustration erreur -->
      <div class="error-images">
        <img
          src="assets/img/bg/error-500.png"
          alt="Erreur serveur 500"
          class="img-fluid"
        />
      </div>

      <!-- Texte -->
      <h1 class="mb-1">Oups, une erreur s’est produite</h1>
      <p class="fs-16 text-muted mb-2">
        Erreur serveur 500.<br />
        Nous nous excusons pour ce désagrément et travaillons à la résolution du problème.
        Veuillez réessayer ultérieurement.
      </p>

      <!-- Bouton -->
      <a
        [routerLink]="routes.index"
        class="btn btn-primary px-4 py-2"
      >
        <i class="ti ti-arrow-left me-2"></i>
        Retour au tableau de bord
      </a>

    </div>
  </div>
</div>
