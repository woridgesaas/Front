<div
  [ngClass]="{
    'mini-sidebar': layoutMode === 'aside' && !expandMenu,
    'expand-menu': layoutMode === 'aside' && expandMenu,
    'menu-horizontal': layoutMode === 'horizontal',
    'slide-nav': mobileSidebar
  }"
>
  <!-- Loader -->
  @if (showPreloader && !withoutWrapperPages) {
    <div id="global-loader">
      <span class="page-loader"></span>
    </div>
  }

  <div class="main-wrapper">
    @if (!withoutWrapperPages) {
      <app-default-header />
      <app-default-sidebar />
      <app-horizontal-sidebar />
    }

    <router-outlet></router-outlet>
  </div>
</div>

<!-- Overlay mobile -->
<div
  class="sidebar-overlay opened"
  [style.display]="mobileSidebar ? 'block' : 'none'"
></div>
