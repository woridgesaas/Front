<div class="modal fade" [id]="modalId" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-bottom">
        <h4 class="modal-title">
          <i class="ti ti-edit me-2"></i>Modifier l'Entretien
        </h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" *ngIf="interview">
        <form>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control"
                     [(ngModel)]="date" name="date">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Heure</label>
              <input type="time" class="form-control"
                     [(ngModel)]="heure" name="heure">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Durée</label>
              <select class="form-select" [(ngModel)]="durationMinutes" name="durationMinutes">
                <option [value]="30">30 minutes</option>
                <option [value]="45">45 minutes</option>
                <option [value]="60">1 heure</option>
                <option [value]="90">1h 30</option>
                <option [value]="120">2 heures</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Type</label>
              <select class="form-select" [(ngModel)]="type" name="type">
                <option [value]="0">Visioconférence</option>
                <option [value]="1">Présentiel</option>
                <option [value]="2">Téléphonique</option>
              </select>
            </div>

            @if(type === 0) {
              <div class="col-12 mb-3">
                <label class="form-label">Lien Visioconférence</label>
                <input type="url" class="form-control"
                       [(ngModel)]="videoConferenceLink" name="videoConferenceLink">
              </div>
            }
            @if(type === 1) {
              <div class="col-12 mb-3">
                <label class="form-label">Salle / Lieu</label>
                <input type="text" class="form-control"
                       [(ngModel)]="location" name="location">
              </div>
            }
            @if(type === 2) {
              <div class="col-12 mb-3">
                <label class="form-label">Numéro de Téléphone</label>
                <input type="tel" class="form-control"
                       [(ngModel)]="phoneNumber" name="phoneNumber">
              </div>
            }

            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" rows="3"
                        [(ngModel)]="notes" name="notes"></textarea>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer border-top">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="cancel()">
          Annuler
        </button>
        <button type="button" class="btn btn-outline-primary" (click)="update()" data-bs-dismiss="modal">
          <i class="ti ti-device-floppy me-1"></i>Enregistrer et Notifier
        </button>
      </div>
    </div>
  </div>
</div>
