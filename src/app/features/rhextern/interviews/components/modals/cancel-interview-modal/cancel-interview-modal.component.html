<div class="modal fade" [id]="modalId" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center p-4">
        <div class="avatar avatar-xl bg-warning-transparent rounded-circle mx-auto mb-3">
          <i class="ti ti-calendar-x fs-36 text-warning"></i>
        </div>
        <h5 class="mb-2">Annuler cet Entretien ?</h5>

        @if(interview) {
          <p class="text-muted mb-3">
            Entretien avec <strong>{{ interview.candidateName }}</strong><br>
            Le {{ formatDate(interview.startDateTime) }}
            à {{ formatTime(interview.startDateTime) }}
          </p>
        }

        <div class="mb-4">
          <label class="form-label text-start d-block">
            Raison de l'annulation <span class="text-danger">*</span>
          </label>
          <textarea class="form-control"
                    [(ngModel)]="raison"
                    rows="3"
                    placeholder="Expliquez la raison de l'annulation...">
          </textarea>
        </div>

        <div class="alert alert-info d-flex align-items-start text-start">
          <i class="ti ti-info-circle me-2 fs-20"></i>
          <small>Les participants seront automatiquement notifiés de cette annulation par email.</small>
        </div>

        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-light"
                  data-bs-dismiss="modal" (click)="close()">
            Retour
          </button>
          <button type="button" class="btn btn-warning"
                  (click)="confirm()"
                  data-bs-dismiss="modal"
                  [disabled]="!raison.trim()">
            <i class="ti ti-calendar-x me-1"></i>Confirmer l'Annulation
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
