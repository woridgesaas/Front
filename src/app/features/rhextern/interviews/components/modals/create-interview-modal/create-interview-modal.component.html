<div class="modal fade" [id]="modalId" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-bottom bg-white text-white">
          <h4 class="modal-title text-black">
            <i class="ti ti-calendar-plus me-2"></i>Planifier un Nouvel Entretien
          </h4>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
  
        <div class="modal-body">
          <form class="row g-3">
            <!-- Section 1: Candidat -->
            <div class="col-12">
              <div class="row g-3 p-3 bg-light rounded">
                <div class="col-12 mb-2">
                  <strong><i class="ti ti-user me-1"></i>Informations du Candidat</strong>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Nom Complet <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control" 
                    [(ngModel)]="candidat.nom" 
                    name="nom" 
                    placeholder="Jean Dupont" 
                    required>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Email <span class="text-danger">*</span></label>
                  <input 
                    type="email" 
                    class="form-control" 
                    [(ngModel)]="candidat.email" 
                    name="email" 
                    placeholder="jean@email.com" 
                    required>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Poste Visé</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    [(ngModel)]="candidat.poste" 
                    name="poste" 
                    placeholder="Développeur Full Stack">
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Téléphone</label>
                  <input 
                    type="tel" 
                    class="form-control" 
                    [(ngModel)]="candidat.telephone" 
                    name="telephone" 
                    placeholder="+33 6 12 34 56 78">
                </div>
              </div>
            </div>
  
            <!-- Section 2: Interviewer -->
            <div class="col-12">
              <div class="row g-3 p-3 bg-light rounded">
                <div class="col-12 mb-2">
                  <strong><i class="ti ti-user-check me-1"></i>Assigner un Interviewer</strong>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Sélectionner l'Interviewer <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    [(ngModel)]="interviewer.nom" 
                    name="interviewer" 
                    required>
                    <option value="">-- Choisir un interviewer --</option>
                    @for (int of interviewers; track int.id) {
                      <option [value]="int.nom">{{ int.nom }} - {{ int.specialite }}</option>
                    }
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Email Interviewer</label>
                  <input 
                    type="email" 
                    class="form-control" 
                    [(ngModel)]="interviewer.email" 
                    name="interviewerEmail" 
                    placeholder="interviewer@entreprise.fr" 
                    required>
                </div>
              </div>
            </div>
  
            <!-- Section 3: Date, Heure, Durée -->
            <div class="col-12">
              <div class="row g-3 p-3 bg-light rounded">
                <div class="col-12 mb-2">
                  <strong><i class="ti ti-clock me-1"></i>Date et Horaire</strong>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Date <span class="text-danger">*</span></label>
                  <input 
                    type="date" 
                    class="form-control" 
                    [(ngModel)]="date" 
                    name="date" 
                    required>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Heure de Début <span class="text-danger">*</span></label>
                  <input 
                    type="time" 
                    class="form-control" 
                    [(ngModel)]="heure" 
                    name="heure" 
                    required>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Durée</label>
                  <select class="form-select" [(ngModel)]="duree" name="duree">
                    <option [value]="30">30 min</option>
                    <option [value]="45">45 min</option>
                    <option [value]="60" selected>1 heure</option>
                    <option [value]="90">1h 30</option>
                    <option [value]="120">2 heures</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Type d'Entretien <span class="text-danger">*</span></label>
                  <select class="form-select" [(ngModel)]="type" name="type" required>
                    <option value="Téléphonique"> Téléphonique</option>
                    <option value="Visioconférence" selected> Visioconférence</option>
                    <option value="Présentiel"> Présentiel</option>
                    <option value="Technique"> Technique</option>
                  </select>
                </div>
              </div>
            </div>
  
            <!-- Section 4: Détails selon le type -->
            <div class="col-12">
              <div class="row g-3 p-3 bg-light rounded">
                <div class="col-12 mb-2">
                  <strong><i class="ti ti-info-circle me-1"></i>Détails de l'Entretien</strong>
                </div>
                @if(type === 'Visioconférence') {
                  <div class="col-md-6">
                    <label class="form-label small">Lien Visioconférence</label>
                    <input 
                      type="url" 
                      class="form-control" 
                      [(ngModel)]="lienVisio" 
                      name="lien" 
                      placeholder="https://meet.google.com/...">
                  </div>
                }
                @if(type === 'Présentiel') {
                  <div class="col-md-6">
                    <label class="form-label small">Salle / Lieu</label>
                    <input 
                      type="text" 
                      class="form-control" 
                      [(ngModel)]="salle" 
                      name="salle" 
                      placeholder="Salle A - 2ème étage">
                  </div>
                }
                <div class="col-12">
                  <label class="form-label small">Notes / Instructions</label>
                  <textarea 
                    class="form-control" 
                    rows="2" 
                    [(ngModel)]="notes" 
                    name="notes" 
                    placeholder="Préparer questions techniques, apporter CV..."></textarea>
                </div>
              </div>
            </div>
          </form>
        </div>
  
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="cancel()">
            <i class="ti ti-x me-1"></i>Annuler
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="create()" data-bs-dismiss="modal">
            <i class="ti ti-calendar-check me-1"></i>Planifier et Envoyer les Invitations
          </button>
        </div>
      </div>
    </div>
  </div>
