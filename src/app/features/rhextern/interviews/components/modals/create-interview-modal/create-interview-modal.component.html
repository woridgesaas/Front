<div class="modal fade" [id]="modalId" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-bottom bg-white">
        <h4 class="modal-title text-black">
          <i class="ti ti-calendar-plus me-2"></i>Planifier un Nouvel Entretien
        </h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form class="row g-3">

          <!-- Section 1: Candidat -->
          <div class="col-12">
            <div class="row g-3 p-3 bg-light rounded">
              <div class="col-12 mb-2">
                <strong><i class="ti ti-user me-1"></i>Informations du Candidat</strong>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Nom Complet <span class="text-danger">*</span></label>
                <input type="text" class="form-control"
                       [(ngModel)]="candidateName" name="candidateName"
                       placeholder="Jean Dupont" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control"
                       [(ngModel)]="candidateEmail" name="candidateEmail"
                       placeholder="jean@email.com" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Poste Visé</label>
                <input type="text" class="form-control"
                       [(ngModel)]="targetPosition" name="targetPosition"
                       placeholder="Développeur Full Stack">
              </div>
              <div class="col-md-3">
                <label class="form-label small">Téléphone</label>
                <input type="tel" class="form-control"
                       [(ngModel)]="candidatePhone" name="candidatePhone"
                       placeholder="+212 6 12 34 56 78">
              </div>
            </div>
          </div>

          <!-- Section 2: Interviewer -->
          <div class="col-12">
            <div class="row g-3 p-3 bg-light rounded">
              <div class="col-12 mb-2">
                <strong><i class="ti ti-user-check me-1"></i>Assigner un Interviewer</strong>
              </div>
              <div class="col-md-6">
                <label class="form-label small">
                  Sélectionner l'Interviewer <span class="text-danger">*</span>
                </label>
                <select class="form-select" name="interviewer" required
                        (change)="onInterviewerSelect($any($event.target).value)">
                  <option value="">-- Choisir un interviewer --</option>
                  @for (int of interviewers; track int.id) {
                    <option [value]="int.id">
                      {{ int.nom }} — {{ int.specialite }}
                    </option>
                  }
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Email Interviewer</label>
                <input type="email" class="form-control"
                       [(ngModel)]="interviewerEmail"
                       name="interviewerEmail"
                       placeholder="Sélectionner un interviewer d'abord"
                       readonly>
              </div>
            </div>
          </div>

          <!-- Section 3: Date, Heure, Durée, Type -->
          <div class="col-12">
            <div class="row g-3 p-3 bg-light rounded">
              <div class="col-12 mb-2">
                <strong><i class="ti ti-clock me-1"></i>Date et Horaire</strong>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control"
                       [(ngModel)]="date" name="date" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Heure de Début <span class="text-danger">*</span></label>
                <input type="time" class="form-control"
                       [(ngModel)]="heure" name="heure" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Durée</label>
                <select class="form-select" [(ngModel)]="durationMinutes" name="durationMinutes">
                  <option [value]="30">30 min</option>
                  <option [value]="45">45 min</option>
                  <option [value]="60">1 heure</option>
                  <option [value]="90">1h 30</option>
                  <option [value]="120">2 heures</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small">
                  Type d'Entretien <span class="text-danger">*</span>
                </label>
                <select class="form-select" [(ngModel)]="type" name="type" required>
                  <option [value]="0">Visioconférence</option>
                  <option [value]="1">Présentiel</option>
                  <option [value]="2">Téléphonique</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Section 4: Détails selon le type -->
          <div class="col-12">
            <div class="row g-3 p-3 bg-light rounded">
              <div class="col-12 mb-2">
                <strong><i class="ti ti-info-circle me-1"></i>Détails de l'Entretien</strong>
              </div>
              @if(type === 0) {
                <div class="col-md-6">
                  <label class="form-label small">Lien Visioconférence</label>
                  <input type="url" class="form-control"
                         [(ngModel)]="videoConferenceLink" name="videoConferenceLink"
                         placeholder="https://meet.google.com/...">
                </div>
              }
              @if(type === 1) {
                <div class="col-md-6">
                  <label class="form-label small">Salle / Lieu</label>
                  <input type="text" class="form-control"
                         [(ngModel)]="location" name="location"
                         placeholder="Salle A - 2ème étage">
                </div>
              }
              @if(type === 2) {
                <div class="col-md-6">
                  <label class="form-label small">Numéro de Téléphone</label>
                  <input type="tel" class="form-control"
                         [(ngModel)]="phoneNumber" name="phoneNumber"
                         placeholder="+212 6 12 34 56 78">
                </div>
              }
              <div class="col-12">
                <label class="form-label small">Notes / Instructions</label>
                <textarea class="form-control" rows="2"
                          [(ngModel)]="notes" name="notes"
                          placeholder="Préparer questions techniques, apporter CV...">
                </textarea>
              </div>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer border-top">
        <button type="button" class="btn btn-light"
                data-bs-dismiss="modal" (click)="cancel()">
          <i class="ti ti-x me-1"></i>Annuler
        </button>
        <button type="button" class="btn btn-outline-primary"
                (click)="create()" data-bs-dismiss="modal">
          <i class="ti ti-calendar-check me-1"></i>Planifier et Envoyer les Invitations
        </button>
      </div>
    </div>
  </div>
</div>
