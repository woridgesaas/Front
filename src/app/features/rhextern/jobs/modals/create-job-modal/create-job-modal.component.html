<div class="modal fade" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <!-- Header -->
      <div class="modal-header border-bottom">
        <h4 class="modal-title">
          <i class="ti ti-briefcase me-2"></i>Créer une Nouvelle Offre d'Emploi
        </h4>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form>
          <div class="row">
            <!-- Titre du Poste -->
            <div class="col-12 mb-3">
              <label class="form-label fw-semibold">
                Titre du Poste <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" 
                     [(ngModel)]="job.Job_Title" 
                     name="titre"
                     placeholder="Ex: Développeur Full Stack Senior">
              <small class="text-muted">Un titre clair et attractif</small>
            </div>

            <!-- Catégorie -->
                  <!-- Catégorie — dynamique depuis l'API -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">
                Catégorie <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="job.Category" name="categorie">
                <option value="">-- Sélectionner une catégorie --</option>
                <option *ngFor="let type of jobTypes" [value]="type.name">
                  {{ type.name }}
                </option>
              </select>
            </div>

            <!-- Type de Contrat -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">
                Type de Contrat <span class="text-danger">*</span>
              </label>
              <select class="form-select" [(ngModel)]="job.Roll" name="type">
                <option value="">-- Sélectionner un type --</option>
                <option value="CDI">CDI - Contrat à Durée Indéterminée</option>
                <option value="CDD">CDD - Contrat à Durée Déterminée</option>
                <option value="Freelance">Freelance</option>
                <option value="Stage">Stage</option>
                <option value="Alternance">Alternance</option>
              </select>
            </div>

            <!-- Localisation -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">
                Localisation <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="ti ti-map-pin"></i></span>
                <input type="text" class="form-control" 
                       [(ngModel)]="job.Location" 
                       name="localisation"
                       placeholder="Ex: Casablanca, Rabat, Tanger ou Télétravail">
              </div>
              <!-- <small class="text-muted">Indiquez la ville ou Télétravail</small> -->
            </div>
            

            <!-- Fourchette Salariale -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Fourchette Salariale</label>
              <div class="input-group">
                <span class="input-group-text">MAD</span>
                <input type="text" class="form-control" 
                       [(ngModel)]="job.Salary_Range" 
                       name="salaire"
                       placeholder="Ex: 10 000 - 20 000 MAD / mois">
              </div>
              <small class="text-muted">Salaire mensuel brut (optionnel)</small>
            </div>
            

            <!-- Années d'Expérience -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Années d'Expérience Requises</label>
              <select class="form-select" [(ngModel)]="job.Experience" name="experience">
                <option value="">-- Sélectionner --</option>
                <option value="0-1">Débutant (0-1 an)</option>
                <option value="1-3">Junior (1-3 ans)</option>
                <option value="3-5">Intermédiaire (3-5 ans)</option>
                <option value="5-10">Senior (5-10 ans)</option>
                <option value="10+">Expert (10+ ans)</option>
              </select>
            </div>

            <!-- Nombre de Postes -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Nombre de Postes</label>
              <input type="number" class="form-control" 
                     [(ngModel)]="job.Number_of_Positions"
                     name="postes"
                     placeholder="Ex: 3"
                     min="1">
            </div>

            <!-- Description du Poste avec NGX Editor -->
            <div class="col-12 mb-3">
              <label class="form-label fw-semibold">Description du Poste</label>
              
              <div class="NgxEditor__Wrapper">
                <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
                <ngx-editor
                  [editor]="editor"
                  [(ngModel)]="job.Description"
                  name="description"
                  [placeholder]="'Décrivez les missions, responsabilités et qualifications requises pour ce poste...'">
                </ngx-editor>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top">
        <button type="button" class="btn btn-light" (click)="close()">
          <i class="ti ti-x me-1"></i>Annuler
        </button>
        <button type="button" class="btn btn-primary" (click)="save()">
          <i class="ti ti-device-floppy me-1"></i>Créer l'Offre
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Backdrop -->
<div class="modal-backdrop fade" [class.show]="isVisible" *ngIf="isVisible"></div>
