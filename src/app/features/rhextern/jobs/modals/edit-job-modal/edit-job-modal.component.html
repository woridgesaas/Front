<div class="modal fade" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header border-bottom">
          <h4 class="modal-title">
            <i class="ti ti-edit me-2"></i>Modifier l'Offre d'Emploi
          </h4>
          <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
        </div>
  
        <!-- Body -->
        <div class="modal-body" *ngIf="job">
          <form>
            <div class="row">
              <!-- Titre du Poste -->
              <div class="col-12 mb-3">
                <label class="form-label fw-semibold">
                  Titre du Poste <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" 
                       [(ngModel)]="job.Job_Title" 
                       name="titre">
              </div>
  
              <!-- Catégorie -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Catégorie <span class="text-danger">*</span>
                </label>
                <select class="form-select" [(ngModel)]="job.Category" name="categorie">
                  <option value="Développement">Développement</option>
                  <option value="Design">Design</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Finance">Finance</option>
                  <option value="Ressources Humaines">Ressources Humaines</option>
                  <option value="Ventes">Ventes</option>
                  <option value="Support">Support Client</option>
                </select>
              </div>
  
              <!-- Type de Contrat -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Type de Contrat</label>
                <select class="form-select" [(ngModel)]="job.Roll" name="type">
                  <option value="CDI">CDI - Contrat à Durée Indéterminée</option>
                  <option value="CDD">CDD - Contrat à Durée Déterminée</option>
                  <option value="Freelance">Freelance</option>
                  <option value="Stage">Stage</option>
                  <option value="Alternance">Alternance</option>
                </select>
              </div>
  
              <!-- Localisation -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Localisation <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text"><i class="ti ti-map-pin"></i></span>
                  <input type="text" class="form-control" 
                         [(ngModel)]="job.Location" 
                         name="localisation">
                </div>
              </div>
  
              <!-- Fourchette Salariale -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Fourchette Salariale</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="ti ti-currency-euro"></i></span>
                  <input type="text" class="form-control" 
                         [(ngModel)]="job.Salary_Range" 
                         name="salaire">
                </div>
              </div>
  
              <!-- Années d'Expérience -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Années d'Expérience</label>
                <select class="form-select" [(ngModel)]="job.Experience" name="experience">
                  <option value="0-1">Débutant (0-1 an)</option>
                  <option value="1-3">Junior (1-3 ans)</option>
                  <option value="3-5">Intermédiaire (3-5 ans)</option>
                  <option value="5-10">Senior (5-10 ans)</option>
                  <option value="10+">Expert (10+ ans)</option>
                </select>
              </div>
  
              <!-- Statut de l'Offre -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Statut de l'Offre</label>
                <select class="form-select" name="statut">
                  <option value="active">Active</option>
                  <option value="pause">En Pause</option>
                  <option value="closed">Fermée</option>
                  <option value="draft">Brouillon</option>
                </select>
              </div>
  
              <!-- Description -->
              <div class="col-12">
                <label class="form-label fw-semibold">Description</label>
                <textarea class="form-control" 
                          rows="4" 
                          name="description" 
                          placeholder="Mettez à jour la description..."></textarea>
              </div>
            </div>
          </form>
        </div>
  
        <!-- Footer -->
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-light" (click)="close()">
            <i class="ti ti-x me-1"></i>Annuler
          </button>
          <button type="button" class="btn btn-primary" (click)="save()">
            <i class="ti ti-device-floppy me-1"></i>Enregistrer les Modifications
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Backdrop -->
  <div class="modal-backdrop fade" [class.show]="isVisible" *ngIf="isVisible"></div>
