<div class="card kpi-card h-100">
  <div class="card-body d-flex justify-content-between align-items-start">

    <!-- Texte -->
    <div class="kpi-content">
      <p class="kpi-title mb-1">
        {{ title }}
      </p>
      <h3 class="kpi-value mb-0">
        {{ value }}
      </h3>
    </div>

    <!-- Icône -->
    <div class="kpi-icon" [ngClass]="'kpi-' + color">
      <i [class]="icon"></i>
    </div>

  </div>
</div>
