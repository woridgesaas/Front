<!--* Modal header -->
<div class="modal-header">

  <!--* Title + icon -->
  <div class="d-flex align-items-center gap-2">
    <i *ngIf="icon" [class]="icon"></i>
    <h5 class="modal-title mb-0"> {{ title }} </h5>
  </div>

  <!--* Close button -->
  <button type="button" class="btn-close" aria-label="Close" (click)="close.emit()"></button>

</div>
