<div class="text-center py-5 my-5">
  <!-- Illustration -->
  <div class="mb-4">
    <!-- SVG ou image -->
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" style="opacity: 0.5;">
      <path d="M8 2V6" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16 2V6" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="3" y="4" width="18" height="18" rx="3" stroke="#6B7280" stroke-width="1.5"/>
      <path d="M3 10H21" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="15" r="1.5" fill="#6B7280"/>
      <circle cx="16" cy="15" r="1.5" fill="#6B7280"/>
      <circle cx="8" cy="15" r="1.5" fill="#6B7280"/>
    </svg>
  </div>

  <h5 class="text-muted mb-3">{{ title }}</h5>

  <p class="text-muted mb-4" style="max-width: 400px; margin: auto;">
    <ng-container *ngIf="showResetButton; else noFilters">
      {{ messageWithFilters }}
    </ng-container>
    <ng-template #noFilters>
      {{ messageWithoutFilters }}
    </ng-template>
  </p>

  <div class="d-flex gap-2 justify-content-center">
    <button *ngIf="showResetButton"
            class="btn btn-outline-secondary"
            (click)="resetFilters.emit()">
      <i class="bi bi-x-circle me-2"></i>{{ resetButtonLabel }}
    </button>
  </div>
</div>
