
    <div class="card-body">

      <div class="mb-3 text-center">
        <h6 class="fw-medium text-gray-5 mt-4 mb-2">
          Bonjour, {{ employeeName }}
        </h6>
        <h4>{{ currentTime }}</h4>
      </div>

      <div class="attendance-circle-progress text-center mx-auto mb-3">
        <span class="progress-left">
          <span
            class="progress-bar border-success"
            [ngStyle]="{ transform: leftTransform }">
          </span>
        </span>

        <span class="progress-right">
          <span
            class="progress-bar border-success"
            [ngStyle]="{ transform: rightTransform }">
          </span>
        </span>

        <div class="avatar avatar-xxl avatar-rounded">
          <img [src]="avatarUrl" alt="Img" />
        </div>
      </div>

      <div class="text-center">
        <div class="badge badge-md badge-primary mb-3">
          Production : {{ productionHours }} hrs
        </div>

        <h6 class="fw-medium d-flex align-items-center justify-content-center mb-3">
          <i class="ti ti-fingerprint text-primary me-1"></i>
          Pointage entrée à {{ checkInTime }}
        </h6>
      </div>

    </div>
