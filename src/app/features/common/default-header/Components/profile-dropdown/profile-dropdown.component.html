<div class="dropdown profile-dropdown">
  <a
    href="#"
    class="dropdown-toggle d-flex align-items-center"
    data-bs-toggle="dropdown"
    (click)="$event.preventDefault()"
  >
    <span class="avatar avatar-sm online">
      <img
        [src]="currentUser?.picturePath ?? defaultAvatar"
        alt="Photo de profil"
        class="img-fluid rounded-circle"
      />
    </span>
  </a>

  <!--* Menu -->
  <div class="dropdown-menu shadow-none dropdown-menu-end">
    <div class="card mb-0">

      <!--* Header -->
      <div class="card-header">
        <div class="d-flex align-items-center">

          <!--* Profile image -->
          <span class="avatar avatar-lg me-2 avatar-rounded">
            <img [src]="currentUser?.picturePath ?? defaultAvatar" alt="Photo de profil"/>
          </span>

          <!--* Full name and email -->
          <div>
            <h5 class="mb-0">{{ currentUser?.fullName ?? "—" }}</h5>
            <p class="fs-12 fw-medium mb-0">{{ currentUser?.email ?? "—" }}</p>
          </div>
        </div>
      </div>

      <div class="card-body">

        <!--* Profile -->
        <a class="dropdown-item d-flex align-items-center py-2" [routerLink]="profileRouteSegments">
          <i class="ti ti-user me-2"></i>
          Profil
        </a>

        <!--* Settings -->
        <a class="dropdown-item d-flex align-items-center py-2" [routerLink]="routes.changePassword">
          <i class="ti ti-settings me-2"></i>
          Paramètres
        </a>
      </div>

      <!--* Logout -->
      <div class="card-footer">
        <a href="#" class="dropdown-item d-flex align-items-center py-2" (click)="logout(); $event.preventDefault()">
          <i class="ti ti-login me-2"></i>
          Déconnexion
        </a>
      </div>
    </div>
  </div>
</div>
