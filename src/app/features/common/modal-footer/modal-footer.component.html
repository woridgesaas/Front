<!--* Modal footer -->
<div class="modal-footer d-flex justify-content-end gap-2">

  <!--* Cancel button -->
  <button type="button" class="btn btn-light" (click)="cancel.emit()">
    {{ cancelText }}
  </button>

  <!--* Submit button -->
  <button type="button" class="btn btn-primary" [disabled]="disabled || loading" (click)="submit.emit()">
    <span class="spinner-border spinner-border-sm me-1" *ngIf="loading"></span>

    <!--* Icon (Optinoal) -->
    <i *ngIf="submitIcon && !loading" [class]="submitIcon + ' me-1'"></i>


    <!--* Text content -->
    <span>{{ loading ? 'Enregistrement...' : submitText }}</span>
  </button>

</div>
