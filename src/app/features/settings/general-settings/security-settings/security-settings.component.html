<div class="row">
  <div class="col-xl-3 theiaStickySidebar">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-column list-group settings-list">
          <a
            [routerLink]="routes.profileSettings"
            class="d-inline-flex align-items-center rounded py-2 px-3"
            >Profile Settings</a
          >
          <a
            [routerLink]="routes.securitySettings"
            class="d-inline-flex align-items-center rounded active py-2 px-3"
            ><i class="ti ti-arrow-badge-right me-2"></i>Security Settings</a
          >
        </div>
      </div>
    </div>
  </div>

  <div class="col-xl-9">
    <div class="card">
      <div class="card-body">
        <div class="border-bottom mb-3 pb-3">
          <h4> réglages de sécurité </h4>
        </div>
          <!--* Change password + Display the time of the latest change -->
          <div class="d-flex justify-content-between align-items-center flex-wrap border-bottom mb-3">
            <div class="mb-3">
				<div class="mb-3 d-flex align-items-center">
					<i class="fa-solid fa-key  me-2"></i>
              		<h5 class="fw-medium mb-1"> Mot de passe </h5>
				</div>
              <div class="d-flex align-items-center">
                <p class="mb-0 me-2 pe-2 border-end"> Définir un mot de passe unique pour protéger votre compte </p>
                <p> Dernier changement <span class="hover-a"> 03 janv. 2024, 09:00 AM </span></p>
              </div>
            </div>
            <div class="mb-3">
              <a href="javascript:void(0);" class="btn btn-primary btn-sm rounded-4" data-bs-toggle="modal" data-bs-target="#change-password"> Changer mot de passe </a>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade custom-modal" id="change-password">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content doctor-profile">

      <div class="modal-header d-flex align-items-center justify-content-between border-bottom">
        <h5 class="modal-title"> Changer mot de passe </h5>
        <a href="javascript:void(0);" data-bs-dismiss="modal" aria-label="Close"><i class="ti ti-circle-x-filled fs-20"></i></a>
      </div>

      <div class="modal-body p-4">

	 <!--* Change Password Form -->
        <form>

		 <!--* Current password input -->
          <div class="mb-3">
            <div class="pass-group">
              <input type="password" [type]="password[0] ? 'text' : 'password'" class="pass-input form-control rounded-4" placeholder="Entrer le mot de passe actuel"/>
              <span class="ti toggle-password ti-eye-off" (click)="togglePassword(0)"></span>
            </div>
          </div>

		 <!--* New password input -->
          <div class="mb-3">
            <div class="pass-group">
              <input type="password" [type]="password[1] ? 'text' : 'password'" class="pass-input form-control rounded-4" placeholder="Entrer le nouveau mot de passe "/>
              <span class="ti toggle-password ti-eye-off" (click)="togglePassword(1)"></span>
            </div>
          </div>

		<!--* Confirm new password -->
          <div class="mb-3">
            <div class="pass-group">
              <input type="password" [type]="password[2] ? 'text' : 'password'" class="pass-input form-control rounded-4" placeholder="Confirmer le mot de passe"/>
              <span class="ti toggle-password ti-eye-off" (click)="togglePassword(2)"></span>
            </div>
          </div>

		   <div class="modal-footer border-top d-flex justify-content-end gap-2">
  				<button type="button" class="btn btn-light rounded-4 bg-danger text-white" data-bs-dismiss="modal">
					<i class="fa-solid fa-xmark me-1"></i> Annuler
				</button>
				<button type="submit" class="btn btn-primary rounded-4">
					<i class="fa-solid fa-floppy-disk me-1"></i> Sauvegarder
			 	</button>
			</div>


        </form>

      </div>

    </div>
  </div>
</div>
