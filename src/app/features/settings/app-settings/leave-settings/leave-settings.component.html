<div class="container py-4 leave-settings">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 leave-settings-header">

        <app-settings-header
          title="Paramétrage de congés"
          description="Gérer les politiques de congés annuels et exceptionnels conformément au droit du travail marocain."
          icon="fa fa-person-walking">
        </app-settings-header>

        <div class="d-flex gap-2 flex-shrink-0">

          <!--* Annual leave button -->
          <app-switch-button
            label="Congé annuel"
            icon="fa-solid fa-umbrella-beach"
            [active]="activeLeaveType === LeaveType.ANNUAL"
            (select)="openAnnualModal()">
          </app-switch-button>

          <!--* Exceptional leave button -->
          <app-switch-button
            label="Congés exceptionnels"
            icon="fa-solid fa-calendar-plus"
            [active]="activeLeaveType === LeaveType.EXCEPTIONAL"
            (select)="openExceptionalModal()">
          </app-switch-button>
        </div>

      </div>
    </div>
  </div>
</div>

<app-annual-leave-modal
  [open]="annualModalOpen"
  [existingConfig]="existingAnnualConfig"
  (close)="annualModalOpen = false"
  (save)="onAnnualSaved()">
</app-annual-leave-modal>

<app-exceptional-leaves-modal
  [open]="exceptionalModalOpen"
  (close)="exceptionalModalOpen = false"
  (save)="onExceptionalSaved()">
</app-exceptional-leaves-modal>
