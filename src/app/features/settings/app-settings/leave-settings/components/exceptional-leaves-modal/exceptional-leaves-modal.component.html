<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">

      <!--* Modal header (title + close button) -->
      <app-modal-header title="Congés exceptionnels" icon="fa-solid fa-calendar-plus" (close)="close.emit()"></app-modal-header>

      <!--* Form -->
      <form (ngSubmit)="submit()">
        <div class="modal-body">

          <!--* Alert information -->
          <app-alert-information description="Les durées minimales ne peuvent pas être réduites."></app-alert-information>
          <div class="card shadow-sm border-0 mb-3" *ngFor="let leave of exceptionalLeaves; trackBy: trackByCode">
            <div class="card-body row gy-3 gx-md-3 gy-md-0 align-items-center">

              <!--* Name -->
              <div class="col-12 col-md-5">
                <label class="form-label fw-medium"> Nom du congé </label>
                <input class="form-control" [(ngModel)]="leave.name" name="name_{{ leave.code }}" readonly/>
              </div>

              <!--* Minimum legal balance -->
              <div class="col-12 col-md-3">
                <label class="form-label fw-medium d-block"> Solde minimum légal </label>
                <span class="badge bg-light text-dark px-3 py-2"> {{ leave.legalDays }} jours </span>
              </div>

               <!--* Balance input -->
              <div class="col-12 col-md-4">
                <label class="form-label fw-medium">Jours accordés</label>
                <input type="number" class="form-control" [(ngModel)]="leave.grantedDays" [min]="leave.legalDays" name="granted_{{ leave.code }}" (ngModelChange)="touched = true"/>

                <!--* Error message for each balance input -->
                <app-form-error-message [show]="touched && isInvalidLeave(leave)" [message]="getLeaveErrorMessage(leave)"></app-form-error-message>
              </div>

            </div>
          </div>

        </div>

        <!--* Modal footer (submit + cancel button) -->
        <app-modal-footer (cancel)="close.emit()" [disabled]="isInvalid" submitText="Configurer" submitIcon="fa-solid fa-gear"></app-modal-footer>

      </form>
    </div>
  </div>
</div>
