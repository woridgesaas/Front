<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">

      <!--* Modal header (title + close button) -->
      <app-modal-header title="Congé annuel" icon="fa-solid fa-umbrella-beach" (close)="close.emit()"></app-modal-header>

      <!--* Form -->
      <form (ngSubmit)="submit()">
        <div class="modal-body">

          <!--* Alert information -->
          <app-alert-information description="Configure le nombre de jours de congé annuel pour chaque collaborateur."></app-alert-information>

          <!--* Annual leave balance input -->
          <label class="form-label fw-medium"> Solde de congé annuel </label>
          <div class="input-group">
            <input type="number" class="form-control" min="0" [(ngModel)]="annualLeaveDays" name="annualLeave" (ngModelChange)="touched = true"/>
            <span class="input-group-text"> jours </span>
          </div>

          <!--* Error message -->
          <app-form-error-message [show]="touched && isInvalid" [message]="getErrorMessage()"></app-form-error-message>

        </div>

        <!--* Modal footer (submit + cancel button) -->
        <app-modal-footer (cancel)="close.emit()" [disabled]="isInvalid" submitText="Configurer" submitIcon="fa-solid fa-gear"></app-modal-footer>

      </form>
    </div>
  </div>
</div>
