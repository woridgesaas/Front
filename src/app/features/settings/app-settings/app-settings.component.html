<div class="row">
  <div class="col-xl-3 theiaStickySidebar">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-column list-group settings-list">

          <!--* Sidebar settings item -->
          <app-settings-sidebar-item 
            *ngFor="let item of settingsMenu; trackBy: trackByRoute"
            [icon]="item.icon"
            [label]="item.label"
            [route]="item.route">
          </app-settings-sidebar-item>

        </div>
      </div>
    </div>
  </div>

  <!--* Content -->
  <div class="col-xl-9">
    <router-outlet></router-outlet>
  </div>
</div>
