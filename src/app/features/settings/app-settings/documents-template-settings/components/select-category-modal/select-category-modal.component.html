<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">

      <!--* Modal header (title  + close button)-->
      <app-modal-header title="Choisir une catégorie" (close)="close.emit()"></app-modal-header>

      <!--* Body (loop to display all documents template category) -->
      <div class="modal-body">
        <ng-container *ngFor="let category of categories; trackBy: trackByCategory">
          <div class="card shadow-sm border-0 mb-3 cursor-pointer" role="button" tabindex="0" (click)="onSelect(category)" (keydown.enter)="onSelect(category)">
            <div class="card-body d-flex align-items-center">
              <h5 class="mb-0">
                <i class="ti ti-folder me-2"></i> {{ category }}
              </h5>
            </div>
          </div>
        </ng-container>
      </div>

    </div>
  </div>
</div>
