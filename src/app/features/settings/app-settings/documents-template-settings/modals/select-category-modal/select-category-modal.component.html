<div class="modal-backdrop fade show" *ngIf="open"></div>
<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">

      <app-modal-header
        title="Choisir une catégorie"
        icon="fa fa-layer-group"
        (close)="close.emit()">
      </app-modal-header>

      <div class="modal-body">
        <div
          class="card shadow-sm border-0 mb-3 cursor-pointer"
          role="button"
          tabindex="0"
          *ngFor="let category of categories; trackBy: trackByCategory"
          (click)="onSelect(category)"
          (keydown.enter)="onSelect(category)">
          <div class="card-body d-flex align-items-center">
            <i class="ti ti-folder me-2"></i>
            <h5 class="mb-0">{{ category | documentCategoryLabel }}</h5>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
