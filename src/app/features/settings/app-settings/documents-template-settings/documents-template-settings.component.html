<div class="container py-4 document-templates">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">

      <app-settings-header
        title="Paramètrage des modèles de documents administratifs"
        description="Gestion centralisée et sécurisée des modèles de documents administratifs RH conformes à la réglementation marocaine."
        icon="fa-solid fa-file-pen">
      </app-settings-header>

      <div class="mt-3">
        <app-switch-button
          label="Modèles de documents"
          icon="fa fa-layer-group"
          [active]="true"
          (select)="open()">
        </app-switch-button>

        <app-select-category-modal
          [open]="selectModalOpen"
          [categories]="categories"
          (select)="onCategorySelected($event)"
          (close)="selectModalOpen = false">
        </app-select-category-modal>

        <app-manage-category-templates-modal
          [open]="manageModalOpen"
          [category]="selectedCategory"
          (saved)="onSaved()"
          (close)="manageModalOpen = false">
        </app-manage-category-templates-modal>
      </div>

    </div>
  </div>
</div>
