<div class="container py-4 document-templates">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">

      <!--* Settings header (Title + description + icon) -->
      <app-settings-header title="Paramètrage des modèles de documents administratifs" description="Gestion centralisée et sécurisée des modèles de documents administratifs RH conformes à la réglementation marocaine." icon="fa-solid fa-file-pen"></app-settings-header>

      <div class="mt-3">

        <!--* Parameter model button -->
        <app-switch-button label="Modèles de documents" icon="fa fa-layer-group" [active]="true" (select)="open()"></app-switch-button>

        <!--* Select category -->
        <app-select-category-modal [open]="selectModalOpen" [categories]="categories" (select)="onCategorySelected($event)" (close)="selectModalOpen = false"/>

        <!--* Manage category template -->
        <app-manage-category-templates-modal [open]="manageModalOpen" [category]="selectedCategory" [templates]="filteredTemplates" (fileSelected)="onFileSelected($event)" (save)="save()" (close)="manageModalOpen = false"/>

      </div>

    </div>
  </div>
</div>
