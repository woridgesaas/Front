<div class="container py-4 document-templates">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">

      <!--* Header -->
      <div class="mb-4">
        <h3 class="fw-bold mb-2"> Paramètrage des modèles de documents administratifs </h3>
        <p class="text-muted"> Gestion centralisée et sécurisée des modèles de documents administratifs RH conformes à la réglementation marocaine. </p>

      </div>

      <!--* Main form -->
      <form>

        <!--* Loop -->
        <ng-container *ngFor="let category of ['Contrats','Attestations','Fin de contrat','Discipline','Stages & formation','Documents internes RH']">

          <!--* Category section -->
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
              <h5 class="mb-0">
                <i class="ti ti-folder me-2"></i> {{ category }}
              </h5>

              <!--* Display or hide parameter button -->
              <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-outline-primary rounded-4" (click)="toggleCategory(category)">
                    <i class="ti ti-settings me-1"></i> {{ showCategories[category] ? 'Masquer les paramètres' : 'Paramétrer' }}
                </button>
              </div>
            </div>
          </div>

          <!--* Category section content -->
          <div *ngIf="showCategories[category]" class="fade-in">
            <div class="document-card mb-3" *ngFor="let doc of documentTypes" [hidden]="doc.category !== category">
              <div class="document-card-body">

                <!--* Document icon -->
                <div class="document-icon">
                  <i class="fa fa-file-text"></i>
                </div>

                <!--* Document content -->
                <div class="document-content">

                  <!--* Document name -->
                  <h6 class="mb-2">{{ doc.name }}</h6>


                  <!--* Document description -->
                  <p class="text-muted small mb-2"> {{ doc.description }} </p>

                  <!--* Document status -->
                  <div *ngIf="doc.file" class="status success">
                    <i class="fa fa-check"></i> Modèle uploadé : {{ doc.file.name }}
                  </div>

                  <div *ngIf="!doc.file" class="status pending">
                    <i class="ti ti-alert-circle"></i> Aucun modèle uploadé
                  </div>
                </div>

                <!--* Upload document input -->
                <div class="document-action">
                  <label class="btn btn-outline-primary rounded-4 mb-0">
                    <i class="ti ti-upload me-1"></i> Ajouter un modèle
                    <input type="file" hidden accept=".pdf,.doc,.docx" (change)="onFileSelected($event, doc)"/>
                  </label>
                </div>

              </div>
            </div>
          </div>

        </ng-container>

        <!--* Save button -->
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-primary px-4 py-2 rounded-4" (click)="saveTemplates()">
            <i class="ti ti-device-floppy me-1"></i> Sauvegarder les modèles
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
