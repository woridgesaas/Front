<div class="container py-4 presence-settings">
  <div class="card shadow-sm border-0">
    <div class="card-body">

      <app-settings-header
        title="Paramétrage de présence et absence"
        description="Définir les règles liées au temps de travail, aux absences et aux impacts administratifs."
        icon="fa fa-clock">
      </app-settings-header>

      <div class="presence-actions mt-3">

        <app-switch-button
          label="Horaires de travail"
          icon="fa fa-clock"
          [active]="activeTab === AttendanceSettingTab.SCHEDULE"
          (select)="openScheduleModal()">
        </app-switch-button>

        <app-switch-button
          label="Justification d'absence"
          icon="fa fa-file-circle-check"
          [active]="activeTab === AttendanceSettingTab.JUSTIFICATION"
          (select)="openJustificationModal()">
        </app-switch-button>

        <app-switch-button
          label="Seuils d'alerte"
          icon="fa fa-triangle-exclamation"
          [active]="activeTab === AttendanceSettingTab.THRESHOLDS"
          (select)="openThresholdsModal()">
        </app-switch-button>

      </div>
    </div>
  </div>
</div>

<!--* Work schedule modal -->
<app-work-schedule-modal
  [open]="scheduleModalOpen"
  [existingConfig]="currentSchedule"
  (close)="scheduleModalOpen = false"
  (save)="saveWorkSchedule($event)">
</app-work-schedule-modal>

<!--* Absence justification modal -->
<app-absence-justification-modal
  [open]="justificationModalOpen"
  [existingConfig]="currentJustification"
  (close)="justificationModalOpen = false"
  (save)="saveAbsenceJustification($event)">
</app-absence-justification-modal>

<!--* Warning thresholds modal -->
<app-warning-thresholds-modal
  [open]="thresholdsModalOpen"
  [existingConfig]="currentThresholds"
  (close)="thresholdsModalOpen = false"
  (save)="saveAlertThresholds($event)">
</app-warning-thresholds-modal>
