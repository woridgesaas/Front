<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content rounded-4">

      <!--* Modal header (title + close button + icon) -->
      <app-modal-header title="Site vitrine" icon="fa-solid fa-globe" (close)="close.emit()"></app-modal-header>

      <!--* Form -->
      <form (ngSubmit)="submit()">
        <div class="modal-body pt-3">

          <!--* Alert information -->
          <app-alert-information description="Le site vitrine est uniforme, seules certaines sections peuvent être personnalisées."></app-alert-information>

          <!--* Content -->
          <div class="bg-light rounded-4 p-4">
            <div class="row g-4">

              <!--* Logo -->
              <div class="col-md-4">
                <label class="form-label fw-medium">
                  <i class="fa-solid fa-image me-1"></i> Logo de l'entreprise
                </label>

                <label class="upload-zone">
                  <i class="fa-solid fa-cloud-arrow-up text-primary"></i>
                  <span class="fw-medium"> Importer un logo </span>
                  <small class="text-muted"> PNG, JPG ou SVG </small>

                  <input type="file" hidden accept=".png,.jpg,.jpeg,.svg" (change)="onFileSelected($event)"/>
                </label>
              </div>

              <!--* Description -->
              <div class="col-md-8">
                <label class="form-label fw-medium">
                  <i class="fa-solid fa-address-card me-1"></i> Présentation de l'entreprise
                 </label>

                <textarea class="form-control form-control-lg " rows="5" name="description" [(ngModel)]="form.description" placeholder="Décrivez brièvement votre entreprise, sa mission et ses valeurs..." ></textarea>
              </div>

              <!--* Primary color -->
              <div class="col-md-6">
                <label class="form-label fw-medium">
                  <i class="fa-solid fa-palette me-1"></i> Couleur principale
                </label>

                <div class="d-flex align-items-center gap-3">
                  <input type="color" class="form-control form-control-color" name="primaryColor" [(ngModel)]="form.primaryColor"/>
                </div>
              </div>

              <!--* Secondary color -->
              <div class="col-md-6">
                <label class="form-label fw-medium">
                  <i class="fa-solid fa-palette me-1"></i> Couleur secondaire
                </label>

                <div class="d-flex align-items-center gap-3">
                  <input type="color" class="form-control form-control-color" name="secondaryColor" [(ngModel)]="form.secondaryColor"/>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!--* Modal footer (submit + cancel button) -->
        <app-modal-footer (cancel)="close.emit()" submitText="Configurer" submitIcon="fa-solid fa-gear"></app-modal-footer>

      </form>
    </div>
  </div>
</div>
