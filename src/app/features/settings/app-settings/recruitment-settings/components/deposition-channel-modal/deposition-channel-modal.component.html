<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">

      <!--* Modal header (title + close button + icon) -->
      <app-modal-header title="Canaux de dépôt des candidatures" icon="fa-solid fa-envelope-open-text" (close)="close.emit()"></app-modal-header>

      <!--* Form -->
      <form (ngSubmit)="submit()">
        <div class="modal-body">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body">

              <!--* Alert information -->
              <app-alert-information description="Les candidatures reçues via ce canal seront automatiquement centralisées."></app-alert-information>

              <!--* Email -->
              <div class="row g-4">
                <div class="col-12">
                  <label class="form-label fw-medium">
                    <i class="fa-solid fa-envelope me-1"></i> Adresse email de recrutement
                  </label>

                  <input type="email" class="form-control" name="recruitmentEmail" [(ngModel)]="form.recruitmentEmail" placeholder="recrutement@entreprise.com" required/>

                  <p class="text-muted mt-2 mb-0 small"> Adresse officielle utilisée pour la réception des candidatures. </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!--* Modal footer (submit + cancel button) -->
        <app-modal-footer (cancel)="close.emit()" submitText="Configurer" submitIcon="fa-solid fa-gear"></app-modal-footer>

      </form>
    </div>
  </div>
</div>
