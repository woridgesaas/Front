<div class="container py-4 recruitment-settings">
  <div class="card shadow-sm border-0">
    <div class="card-body">

      <!--* Settings header (Title + description + icon) -->
      <app-settings-header title="Paramétrage de recrutement" description="Configurez votre site vitrine et les canaux de dépôt afin de centraliser les candidatures de manière sécurisée et structurée." icon="fa-solid fa-user-gear"></app-settings-header>

      <!--* Switch button (showcase website + deposition chanels) -->
        <div class="d-flex gap-2 flex-shrink-0 mt-3">
          <!--* Showcase website switch button -->
          <app-switch-button label="Site vitrine" icon="fa-solid fa-globe" [active]="activeRecruitmentType === RecruitmentType.SHOWCASE" (select)="openShowcaseModal()"></app-switch-button>

          <!--* Deposition channels switch button -->
          <app-switch-button label="Canal de dépôt" icon="fa-solid fa-envelope-open-text" [active]="activeRecruitmentType === RecruitmentType.CHANNELS" (select)="openChannelsModal()"></app-switch-button>

        </div>

    </div>
  </div>
</div>

<!--* Showcase Website Modal -->
<app-showcase-website-modal [open]="showcaseModalOpen" (close)="showcaseModalOpen = false" (save)="markConfigured()"></app-showcase-website-modal>

<!--* Deposition Channels Modal -->
<app-deposition-channel-modal [open]="channelsModalOpen" (close)="channelsModalOpen = false" (save)="markConfigured()"></app-deposition-channel-modal>
