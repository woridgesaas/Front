<div class="container py-4 recruitment-settings">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">

      <app-settings-header
        title="Paramétrage de recrutement"
        description="Configurez votre site vitrine afin de centraliser les candidatures de manière sécurisée et structurée."
        icon="fa-solid fa-user-gear">
      </app-settings-header>

      <div class="mt-3">
        <app-switch-button
          label="Site vitrine"
          icon="fa-solid fa-globe"
          [active]="true"
          (select)="openShowcaseModal()">
        </app-switch-button>
      </div>

    </div>
  </div>
</div>

<app-showcase-website-modal
  [open]="showcaseModalOpen"
  [existingConfig]="currentRecruitmentSite"
  (close)="showcaseModalOpen = false"
  (save)="saveRecruitmentSite($event)">
</app-showcase-website-modal>
