<div class="page-wrapper">
  <div class="content">

    <!--* Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs></app-breadcrumbs>
    </div>

    <!--* Settings tabs -->
    <ul class="nav nav-tabs nav-tabs-solid bg-transparent border-bottom mb-3">
      <li class="nav-item" *ngFor="let tab of tabs; trackBy: trackByTab">
        <app-settings-tab-item [label]="tab.label" [icon]="tab.icon" [link]="tab.link" [exact]="tab.exact" [activeWhenStartsWith]="tab.activeWhenStartsWith"></app-settings-tab-item>
      </li>
    </ul>

    <!--* Page content -->
    <router-outlet></router-outlet>

  </div>

  <!--* Footer -->
  <app-footer></app-footer>

</div>
