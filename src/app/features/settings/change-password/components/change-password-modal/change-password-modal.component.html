<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <!--* Header -->
      <div class="modal-header">
        <h5 class="modal-title"> Changer mot de passe </h5>
        <button class="btn-close" (click)="close.emit()"></button>
      </div>

      <!--* Body (Form) -->
      <div class="modal-body">
        <form (ngSubmit)="submit()">

          <!--* Password input -->
          <div class="mb-3" *ngFor="let field of passwordFields; trackBy: trackByPlaceholder">
            <app-password-input [placeholder]="field.placeholder">
            </app-password-input>
          </div>

          <!--* Submit or cancel button -->
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" (click)="close.emit()"> Annuler </button>
            <button type="submit" class="btn btn-primary"> Sauvegarder </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
