<div class="modal-backdrop fade show" *ngIf="open"></div>

<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">

      <div class="modal-header">
        <h5 class="modal-title">Changer mot de passe</h5>
        <button class="btn-close" (click)="close.emit()"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="submit()">

          <div class="mb-3">
            <app-password-input
  placeholder="Mot de passe actuel"
  [control]="currentPasswordControl">
</app-password-input>
          </div>

          <div class="mb-3">
           <app-password-input
  placeholder="Nouveau mot de passe"
  [control]="newPasswordControl">
</app-password-input>
          </div>

          <div class="mb-3">
            <app-password-input
  placeholder="Confirmer le mot de passe"
  [control]="confirmPasswordControl">
</app-password-input>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" (click)="close.emit()">Annuler</button>
            <button type="submit" class="btn btn-primary">Sauvegarder</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
