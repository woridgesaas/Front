<div class="card shadow-sm rounded-4">
  <div class="card-body p-4">

    <!--* Header -->
    <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
      <div class="d-flex align-items-center gap-2">
          <i class="fas fa-key"></i>
          <h5 class="mb-0 fw-semibold"> Changer mot de passe </h5>
      </div>
    </div>

    <!--* Content -->
    <div class="row align-items-center">
      <div class="col-md-8">
        <p class="mb-2 text-muted"> Protégez votre compte en utilisant un mot de passe fort et unique. </p>

        <div class="d-flex align-items-center gap-2 small text-muted">
          <i class="fa-regular fa-clock"></i>
          <span> Dernière modification :
            <strong class="hover-a"> 03 janv. 2024 à 09:00 </strong>
          </span>
        </div>
      </div>

      <!--* Update password button -->
      <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <button class="btn btn-primary" (click)="openModal()">
          <i class="fas fa-user-cog me-2"></i> Modifier le mot de passe
        </button>
      </div>
    </div>
  </div>
</div>

<!--* Change password modal -->
<app-change-password-modal [open]="isModalOpen" (close)="closeModal()"></app-change-password-modal>
