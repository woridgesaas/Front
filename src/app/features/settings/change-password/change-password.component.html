<div class="card shadow-sm rounded-4">
  <div class="card-body p-4">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
      <div class="d-flex align-items-center gap-2">
        <i class="fas fa-key"></i>
        <h5 class="mb-0 fw-semibold">Changer mot de passe</h5>
      </div>
    </div>

    <!-- Message succès -->
    <div *ngIf="showSuccess" class="success-box mb-3">
      ✔ Mot de passe mis à jour avec succès
    </div>

    <!-- Content -->
    <div class="row align-items-center">
      <div class="col-md-8">

        <p class="mb-2 text-muted">
          Protégez votre compte en utilisant un mot de passe fort et unique.
        </p>

        <div class="d-flex align-items-center gap-2 small text-muted">
          <i class="fa-regular fa-clock"></i>

          <!-- Dernière modification -->
          <div *ngIf="lastPasswordUpdate">
            <span>
              Dernière modification :
              {{ lastPasswordUpdate | date:'dd MMM yyyy à HH:mm':'':'fr' }}
            </span>
          </div>

          <!-- Jamais modifié -->
          <div *ngIf="passwordNeverChanged" class="alert alert-warning mt-2 mb-0">
            Votre mot de passe n’a pas encore été modifié.
          </div>

        </div>
      </div>

      <!-- Bouton -->
      <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <button class="btn btn-primary" (click)="openModal()">
          <i class="fas fa-user-cog me-2"></i>
          Modifier le mot de passe
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<app-change-password-modal
  [open]="isModalOpen"
  (close)="closeModal()"
  (passwordChanged)="onPasswordChanged($event)">
</app-change-password-modal>
