<!-- Ajouter un congé -->
<div class="modal fade" id="add_leaves">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Ajouter une demande de congé</h4>
        <button
          type="button"
          class="btn-close custom-btn-close"
          data-bs-dismiss="modal"
          aria-label="Fermer"
        >
          <i class="ti ti-x"></i>
        </button>
      </div>

      <form>
        <div class="modal-body pb-0">
          <div class="row">

            <div class="col-md-12">
              <div class="mb-3">
            <label class="form-label">Nom de l’employé</label>
                <input type="text" class="form-control" disabled />
              </div>
            </div>

            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Type de congé</label>
                <mat-select
                  placeholder="Sélectionner"
                  class="select custom-mat-select"
                >
                  <mat-option value="1">Sélectionner</mat-option>
                  <mat-option value="1">Congé maladie</mat-option>
                  <mat-option value="1">Congé exceptionnel</mat-option>
                  <mat-option value="1">Congé annuel</mat-option>
                </mat-select>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3 ngx-date3">
                <label class="form-label">Du</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date3"
                    placeholder="jj/mm/aaaa"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3 ngx-date4">
                <label class="form-label">Au</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date4"
                    placeholder="jj/mm/aaaa"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Nombre de jours</label>
                <input type="text" class="form-control"  />
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Jours restants</label>
                <input type="text" class="form-control"  />
              </div>
            </div>

            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Motif</label>
                <textarea class="form-control" rows="3"></textarea>
              </div>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light me-2"
            data-bs-dismiss="modal"
          >
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            Ajouter le congé
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
<!-- /Ajouter un congé -->
<div class="modal fade" id="adminDocumentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Demande de document administratif</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form>
        <div class="modal-body">

          <!-- Nom employé -->
          <div class="mb-3">
            <label class="form-label">Nom de l’employé</label>
            <input
              type="text"
              class="form-control"
              value="Adrian"
              disabled
            />
          </div>

          <!-- Type de document -->
          <div class="mb-3">
            <label class="form-label">Type de document</label>
            <select class="form-select">
              <option selected disabled>Sélectionner</option>
              <option>Attestation de travail</option>
              <option>Attestation de salaire</option>
              <option>Attestation de congé</option>
              <option>Certificat administratif</option>
            </select>
          </div>

          <!-- Langue -->
          <div class="mb-3">
            <label class="form-label">Langue du document</label>
            <select class="form-select">
              <option>Français</option>
              <option>Arabe</option>
              <option>Anglais</option>
            </select>
          </div>

          <!-- Commentaire -->
          <div class="mb-3">
            <label class="form-label">Commentaire (optionnel)</label>
            <textarea
              class="form-control"
              rows="3"
              placeholder="Ex : pour banque, visa, administration..."
            ></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light me-2"
            data-bs-dismiss="modal" 
          >
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            Envoyer la demande
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
