
 

    <!-- Welcome -->
  <div class="row mb-4">
  <div class="col-xl-8 col-lg-7">
    <div class="card border-0 h-100">
      <div class="card-body d-flex align-items-center">
        <!-- Avatar -->
        <span class="avatar avatar-xl flex-shrink-0">
          <img
            src="assets/img/profiles/avatar-31.jpg"
            class="rounded-circle"
            alt="img"
          />
        </span>

        <!-- Texte -->
        <div class="ms-3">
          <h3 class="mb-2 d-flex align-items-center gap-2">
            Bienvenue Imane AMMARI
            <a
              [routerLink]="['/employees/employee-details']"
              class="text-muted"
              aria-label="Modifier le profil"
            >
              <i class="ti ti-edit fs-14"></i>
            </a>
          </h3>

           <p class="mb-0">
          Votre
          <a
            class="text-primary text-decoration-underline fw-semibold"
            [routerLink]="['/employees/documents']"
          >
            Attestation de travail
          </a>
          est prêt
        </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Carte Date / Heure -->
  <div class="col-xl-4 col-lg-5">
    <div class="card border-0 h-100">
      <div class="card-body d-flex align-items-center">
  <span class="avatar avatar-lg bg-primary rounded-circle me-3">
    <i class="ti ti-calendar fs-18"></i>
  </span>

  <div>
    <!-- Date -->
    <p class="fw-semibold mb-1 fs-16">
      {{ now | date : "EEEE dd MMMM yyyy" }}
    </p>

    <!-- Heure -->
    <span class="text-muted fs-14">
      {{ now | date : "HH:mm:ss" }}
    </span>
  </div>
</div>

    </div>
  </div>
</div>
