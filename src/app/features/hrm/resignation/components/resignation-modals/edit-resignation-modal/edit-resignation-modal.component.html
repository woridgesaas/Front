<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <!-- HEADER -->
      <app-modal-header
        title="Modifier la démission"
        icon="ti ti-edit"
        (close)="cancel.emit()">
      </app-modal-header>

      <form (ngSubmit)="submit()">
        <div class="modal-body">

          <!-- Employé (readonly) -->
          <div class="mb-3">
            <label class="form-label">Employé</label>
            <input
              type="text"
              class="form-control"
              [value]="form?.userFullName || ''"
              disabled
            />
          </div>

          <!-- Département (readonly) -->
          <div class="mb-3">
            <label class="form-label">Département</label>
            <input
              type="text"
              class="form-control"
              [value]="form?.departmentName || ''"
              disabled
            />
          </div>

          <!-- Date préavis -->
          <div class="mb-3">
            <label class="form-label">Date de préavis</label>
            <div class="input-icon position-relative">
              <span class="input-icon-addon">
                <i class="ti ti-calendar text-gray-9"></i>
              </span>
              <input
                type="text"
                class="form-control"
                bsDatepicker
                [(ngModel)]="form.noticeDate"
                name="noticeDate"
                placeholder="jj/mm/aaaa"
              />
            </div>
          </div>

          <!-- Date démission -->
          <div class="mb-3">
            <label class="form-label">Date de démission</label>
            <div class="input-icon position-relative">
              <span class="input-icon-addon">
                <i class="ti ti-calendar text-gray-9"></i>
              </span>
              <input
                type="text"
                class="form-control"
                bsDatepicker
                [(ngModel)]="form.resignationDate"
                name="resignationDate"
                placeholder="jj/mm/aaaa"
              />
            </div>
          </div>

          <!-- Motif -->
          <div class="mb-3">
            <label class="form-label">Motif</label>
            <textarea
              class="form-control"
              rows="3"
              [(ngModel)]="form.reason"
              name="reason">
            </textarea>
          </div>

        </div>

        <!-- FOOTER -->
        <app-modal-footer
          submitText="Enregistrer"
          submitIcon="ti ti-device-floppy"
          (cancel)="cancel.emit()">
        </app-modal-footer>
      </form>
    </div>
  </div>
</div>
