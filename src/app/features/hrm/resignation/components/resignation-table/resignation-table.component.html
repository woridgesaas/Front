<div class="table-responsive">
  <table
    matSort
    (matSortChange)="onSortChange($event)"
    class="mat-sort table datanew table-center datatable dataTable mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th class="no-sort">
          <div class="form-check form-check-md">
            <input
              class="form-check-input"
              type="checkbox"
              [(ngModel)]="initChecked"
              (change)="onSelectAll()"
            />
          </div>
        </th>

        <th mat-sort-header="ResigningEmployee">Employé démissionnaire</th>
        <th mat-sort-header="Department">Département</th>
        <th mat-sort-header="Reason">Motif</th>
        <th mat-sort-header="NoticeDate">Date de préavis</th>
        <th mat-sort-header="ResignationDate">Date de démission</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let data of tableData">
        <td>
          <div class="form-check form-check-md">
            <input
              class="form-check-input"
              type="checkbox"
              [(ngModel)]="data.isSelected"
            />
          </div>
        </td>

        <td>
          <div class="d-flex align-items-center file-name-icon">
            <span class="avatar avatar-md border avatar-rounded">
              <img
                [src]="'assets/img/users/' + data.Image"
                class="img-fluid"
                alt="img"
              />
            </span>
            <div class="ms-2">
              <h6 class="fw-medium">{{ data.ResigningEmployee }}</h6>
            </div>
          </div>
        </td>

        <td>{{ data.Department }}</td>
        <td>{{ data.Reason }}</td>
        <td>{{ data.NoticeDate | date : "dd/MM/yyyy" }}</td>
        <td>{{ data.ResignationDate | date : "dd/MM/yyyy" }}</td>

        <td>
          <div class="action-icon d-inline-flex">
            <a class="me-2" (click)="edit.emit(data)">
              <i class="ti ti-edit"></i>
            </a>

            <a
              class="text-danger"
              data-bs-toggle="modal"
              data-bs-target="#deleteModal"
              (click)="delete.emit(data)"
            >
              <i class="ti ti-trash"></i>
            </a>
          </div>
        </td>
      </tr>

      <tr *ngIf="!tableData.length">
        <td colspan="7">
          <h5 class="no-record">Aucun enregistrement trouvé</h5>
        </td>
      </tr>
    </tbody>
  </table>
</div>
