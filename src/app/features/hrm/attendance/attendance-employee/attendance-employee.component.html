<div class="content">
  <!-- Breadcrumb -->
  <div
    class="d-md-flex d-block align-items-center justify-content-between mb-3"
  >
    <app-breadcrumbs></app-breadcrumbs>
    <app-attendance-view-switch
      [employeeRoute]="routes.attendanceemployee"
      [adminRoute]="routes.attendanceadmin"
    ></app-attendance-view-switch>
  </div>
  <!-- /Breadcrumb -->
  <div class="row">
    <div class="col-xl-3 col-lg-4 d-flex">
      <div class="card flex-fill">
        <app-employee-summary
          [employeeName]="'Douae doudi 💜'"
          [currentTime]="'08:35 AM, 11 Mar 2025'"
          [productionHours]="3.45"
          [checkInTime]="'10:00 AM'"
          [avatarUrl]="'assets/img/profiles/avatar-27.jpg'"
          [progress]="65"
        ></app-employee-summary>
      </div>
    </div>
    <div class="col-xl-9 col-lg-8 d-flex">
      <app-employee-kpis></app-employee-kpis>
    </div>
  </div>
  <div class="card">
    <app-attendance-history-header
      [bsRangeValue]="bsRangeValue"
      (bsRangeValueChange)="bsRangeValue = $event"
      (statusChange)="onStatusFilter($event)"
      (sortChange)="onSortFilter($event)"
    >
    </app-attendance-history-header>

    <div class="card-body p-0">
      <div class="custom-datatable-filter">
        <div class="dataTables_wrapper dt-bootstrap5 no-footer">
            <app-filter
            [pageSize]="pageSize"
            (searchChange)="onSearch($event)"
            (pageSizeChange)="onPageSizeChange($event)"
          >
          </app-filter>


          <app-attendance-employee-table
            [tableData]="tableData"
            [deadTimeHours]="8"
            [warningMinHours]="5"
          >
          </app-attendance-employee-table>

          <app-custom-pagination></app-custom-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
