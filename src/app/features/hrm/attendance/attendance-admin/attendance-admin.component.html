<div class="content">
  <!-- Breadcrumb -->
  <div
    class="d-md-flex d-block align-items-center justify-content-between mb-3"
  >
    <app-breadcrumbs></app-breadcrumbs>
    <app-attendance-view-switch
      [employeeRoute]="routes.attendanceemployee"
      [adminRoute]="routes.attendanceadmin"
    ></app-attendance-view-switch>
  </div>
  <!-- /Breadcrumb -->
  <!-- KPIs -->
  <app-attendance-kpis></app-attendance-kpis>
  <!-- /KPIs -->
  <div class="card">
    <app-attendance-filters
      (dateChange)="onDateFilter($event)"
      (departmentChange)="onDepartmentFilter($event)"
      (statusChange)="onStatusFilter($event)"
      (sortChange)="onSortFilter($event)" >
    </app-attendance-filters>
    <div class="card-body p-0">
      <div class="custom-datatable-filter">
        <div class="dataTables_wrapper dt-bootstrap5 no-footer">
          <app-filter
            [pageSize]="pageSize"
            (searchChange)="searchData($event)"
            (pageSizeChange)="changePageSize($event)"
          >
          </app-filter>
          <app-attendance-table
            [tableData]="tableData"
            (sortChange)="sortData($event)"
            (approveOvertime)="approve($event)"
            (rejectOvertime)="reject($event)"
          >
          </app-attendance-table>
          <app-custom-pagination></app-custom-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
