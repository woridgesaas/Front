<div class="table-responsive">
  <table
    matSort
    (matSortChange)="onSort($event)"
    class="table datanew table-center mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th>Employé</th>
        <th>Date</th>
        <th>Entrée</th>
        <th>Sortie</th>
        <th>Statut</th>
        <th>Heures production</th>
        <th>Décision manager</th>
        <th>Carte RFID</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let row of tableData; trackBy: trackByEmployee"
        [ngClass]="{
          'row-absent': getUiStatus(row) === 'ABSENT'
        }"
      >
        <!-- Employé -->
        <td>
          <div class="d-flex align-items-center file-name-icon">
            <a class="avatar avatar-md border avatar-rounded">
              <img
                src="assets/img/users/{{ row?.Image }}"
                class="img-fluid"
                alt="img"
              />
            </a>
            <div class="ms-2">
              <h6 class="fw-medium">{{ row.Employee }}</h6>
              <span class="fs-12">{{ row.Role }}</span>
            </div>
          </div>
        </td>

        <!-- Date -->
        <td>
          <span class="text-muted">{{ row.Date | date: 'dd/MM/yyyy' }}</span>
        </td>

        <!-- Entrée -->
        <td>{{ row.CheckIn }}</td>

        <!-- Sortie -->
        <td>{{ row.CheckOut || '-' }}</td>

        <!-- Statut -->
        <td>
          <span
            class="badge d-inline-flex align-items-center badge-xs"
            [ngClass]="statusBadgeClass(row)"
          >
            <i class="ti ti-point-filled me-1"></i>
            {{ getStatusLabel(row) }}
          </span>
        </td>

        <!-- Heures production -->
        <td>
          <span
            class="badge d-inline-flex align-items-center"
            [ngClass]="hoursBadgeClass(row)"
          >
            <i class="ti ti-clock-hour-11 me-1"></i>
            {{ row.ProductionHours }}
          </span>
        </td>

        <!-- Décision manager -->
        <td>
          <ng-container *ngIf="showManagerDecision(row)">
            <button
              *ngIf="row.overtimeDecision === 'PENDING'"
              class="btn btn-success btn-sm me-1"
              (click)="approve(row)"
            >
              Accepter
            </button>
            <button
              *ngIf="row.overtimeDecision === 'PENDING'"
              class="btn btn-danger btn-sm"
              (click)="reject(row)"
            >
              Refuser
            </button>
            <span
              *ngIf="row.overtimeDecision === 'APPROVED'"
              class="badge badge-success"
            >
              Approuvé
            </span>
            <span
              *ngIf="row.overtimeDecision === 'REJECTED'"
              class="badge badge-danger"
            >
              Refusé
            </span>
          </ng-container>
        </td>

        <!-- Carte RFID -->
        <td>
          <!-- En cours -->
          <button
            *ngIf="isRfidLoading(row)"
            class="btn btn-sm btn-outline-secondary"
            disabled
          >
            <span class="spinner-border spinner-border-sm me-1"></span>
            En attente...
          </button>

          <!-- Carte active → Désactiver -->
          <button
            *ngIf="!isRfidLoading(row) && getRfidStatus(row)"
            class="btn btn-sm btn-outline-danger"
            (click)="deactivateCard(row)"
          >
            <i class="ti ti-credit-card-off me-1"></i>
            Désactiver
          </button>

          <!-- Pas de carte → Enrollment -->
          <button
            *ngIf="!isRfidLoading(row) && !getRfidStatus(row)"
            class="btn btn-sm btn-outline-primary"
            (click)="startEnrollment(row)"
          >
            <i class="ti ti-credit-card me-1"></i>
            Carte RFID
          </button>
        </td>
      </tr>

      <!-- Tableau vide -->
      <tr *ngIf="!tableData.length">
        <td colspan="8" class="text-center py-3">
          Aucun enregistrement trouvé
        </td>
      </tr>
    </tbody>
  </table>
</div>
