<div
  class="modal fade"
  id="edit_employee_detail"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <app-modal-header
        [title]="'Modifier les informations'"
        [icon]="'ti ti-edit'"
        (close)="closeModal()"
      ></app-modal-header>

      <div class="modal-body pt-3 pb-0 edit-employee-modal-body">
        <ul class="nav nav-pills nav-justified mb-3 flex-wrap gap-2">
          <li class="nav-item">
            <button
              type="button"
              class="nav-link w-100"
              [class.active]="activeSection === 'personal'"
              (click)="setSection('personal')"
            >
              <i class="ti ti-user me-1"></i>
              <span class="d-none d-md-inline">Informations personnelles</span>
            </button>
          </li>

          <li class="nav-item">
            <button
              type="button"
              class="nav-link w-100"
              [class.active]="activeSection === 'bank'"
              (click)="setSection('bank')"
            >
              <i class="ti ti-building-bank me-1"></i>
              <span class="d-none d-md-inline">Informations bancaires</span>
            </button>
          </li>

          <li class="nav-item">
            <button
              type="button"
              class="nav-link w-100"
              [class.active]="activeSection === 'education'"
              (click)="setSection('education')"
            >
              <i class="ti ti-school me-1"></i>
              <span class="d-none d-md-inline">Formation</span>
            </button>
          </li>

          <li class="nav-item">
            <button
              type="button"
              class="nav-link w-100"
              [class.active]="activeSection === 'experience'"
              (click)="setSection('experience')"
            >
              <i class="ti ti-briefcase me-1"></i>
              <span class="d-none d-md-inline">Expérience</span>
            </button>
          </li>

          <li class="nav-item" *ngIf="showSecuritySection">
            <button
              type="button"
              class="nav-link w-100"
              [class.active]="activeSection === 'security'"
              (click)="setSection('security')"
            >
              <i class="ti ti-lock me-1"></i>
              <span class="d-none d-md-inline">Sécurité</span>
            </button>
          </li>
        </ul>

        <app-personal-information-section
          *ngIf="activeSection === 'personal'"
          #personalSection
          [employee]="employeeData"
          (saved)="onPersonalSaved($event)"
        ></app-personal-information-section>

        <app-bank-information-section
          *ngIf="activeSection === 'bank'"
          #bankSection
          [employee]="employeeData"
          (saved)="onBankSaved($event)"
        ></app-bank-information-section>

        <app-education-section
          *ngIf="activeSection === 'education'"
          #educationSection
          [employee]="employeeData"
          (saved)="onEducationSaved($event)"
          (deleted)="onEducationDeleted($event)"
        ></app-education-section>

        <app-professional-experience-section
          *ngIf="activeSection === 'experience'"
          #experienceSection
          [employee]="employeeData"
          (saved)="onExperienceSaved($event)"
          (deleted)="onExperienceDeleted($event)"
        ></app-professional-experience-section>

        <app-security-modal
          *ngIf="activeSection === 'security' && showSecuritySection"
          [employee]="employeeData"
        ></app-security-modal>
      </div>

      <app-modal-footer
        *ngIf="showFooterSave"
        [disabled]="isSubmitDisabled"
        [loading]="isCurrentSectionSaving"
        [submitText]="submitButtonText"
        [submitIcon]="'ti ti-device-floppy'"
        [cancelText]="'Fermer'"
        (cancel)="closeModal()"
        (submit)="submitActiveSection()"
      ></app-modal-footer>
    </div>
  </div>
</div>
