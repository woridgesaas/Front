<div class="modal fade" id="edit_employee_multistep">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <div class="d-flex align-items-center">
            <h4 class="modal-title me-2">Modifier les Informations de l'Employé</h4>
          </div>
          <button
            type="button"
            class="btn-close custom-btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="resetForm()"
          >
            <i class="ti ti-x"></i>
          </button>
        </div>
  
        <!-- Indicateur d'étapes -->
        <div class="modal-body pt-3 pb-0">
          <ul class="nav nav-pills nav-justified mb-4">
            <li class="nav-item">
              <a 
                class="nav-link" 
                [class.active]="currentStep === 1"
                (click)="goToStep(1)"
                style="cursor: pointer;"
              >
                <i class="ti ti-user me-2"></i>
                <span class="d-none d-md-inline">Informations Personnelles</span>
                <span class="d-inline d-md-none">Info</span>
              </a>
            </li>
            <li class="nav-item">
              <a 
                class="nav-link" 
                [class.active]="currentStep === 2"
                (click)="goToStep(2)"
                style="cursor: pointer;"
              >
                <i class="ti ti-building-bank me-2"></i>
                <span class="d-none d-md-inline">Informations Bancaires</span>
                <span class="d-inline d-md-none">Banque</span>
              </a>
            </li>
            <li class="nav-item">
              <a 
                class="nav-link" 
                [class.active]="currentStep === 3"
                (click)="goToStep(3)"
                style="cursor: pointer;"
              >
                <i class="ti ti-school me-2"></i>
                <span class="d-none d-md-inline">Formation</span>
                <span class="d-inline d-md-none">Formation</span>
              </a>
            </li>
            <li class="nav-item">
              <a 
                class="nav-link" 
                [class.active]="currentStep === 4"
                (click)="goToStep(4)"
                style="cursor: pointer;"
              >
                <i class="ti ti-briefcase me-2"></i>
                <span class="d-none d-md-inline">Expérience</span>
                <span class="d-inline d-md-none">Expérience</span>
              </a>
            </li>
          </ul>
        </div>
  
        <form [formGroup]="editEmployeeForm">
          <!-- Étape 1 -->
          <app-personal-info-step
            *ngIf="currentStep === 1"
            [formGroup]="editEmployeeForm"
          ></app-personal-info-step>
  
          <!-- Étape 2 -->
          <app-bank-info-step
            *ngIf="currentStep === 2"
            [bankInfoGroup]="editEmployeeForm.get('bankInfo')"
          ></app-bank-info-step>
  
          <!-- Étape 3 -->
          <app-education-step
            *ngIf="currentStep === 3"
            [educationArray]="educationArray"
            [currentYear]="currentYear"
          ></app-education-step>
  
          <!-- Étape 4 -->
          <app-experience-step
            *ngIf="currentStep === 4"
            [experienceArray]="experienceArray"
          ></app-experience-step>
  
          <!-- Footer -->
          <div class="modal-footer d-flex justify-content-between align-items-center">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
              (click)="cancelAndClose()"
            >
              <i class="ti ti-x me-1"></i>Fermer
            </button>
            
            <div class="d-flex gap-2">
              <button
                type="button"
                class="btn btn-secondary"
                *ngIf="currentStep > 1"
                (click)="previousStep()"
              >
                <i class="ti ti-arrow-left me-1"></i>Précédent
              </button>
  
              <button
                type="button"
                class="btn btn-primary"
                *ngIf="currentStep < 4"
                (click)="nextStep()"
              >
                Suivant<i class="ti ti-arrow-right ms-1"></i>
              </button>
              
              <button
                type="button"
                class="btn btn-success"
                (click)="saveCurrentSection()"
              >
                <i class="ti ti-check me-1"></i>Enregistrer Section {{ currentStep }}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
