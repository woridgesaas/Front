<div class="content">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <app-breadcrumbs></app-breadcrumbs>

    <button class="btn btn-purple" (click)="resetForm()">
      <i class="ti ti-refresh"></i> Nouveau
    </button>
  </div>

  <div class="row">
    <!-- ================= LEFT COLUMN ================= -->
    <div class="col-xl-4 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-purple text-white">
          <h5 class="mb-0">Configuration du contrat</h5>
        </div>

        <div class="card-body">
          <!-- Informations -->
          <h6 class="section-title">Informations</h6>

         

         
          <!-- Employé -->
          <div class="mb-3">
            <label class="form-label">CIN</label>
            <input class="form-control"  />
          </div>

          <!-- Employé -->
          <div class="mb-3">
            <label class="form-label">Nom & Prénom</label>
            <input class="form-control"  />
          </div>
       
          <!-- Type contrat -->
          <h6 class="section-title mt-4">Type de contrat</h6>

          <select class="form-select mb-4" [(ngModel)]="selectedContratType">
            <option value="">Sélectionner le modèle</option>
            <option value="cdi">CDI</option>
            <option value="cdd">CDD</option>
          </select>

          <button class="btn btn-purple w-100" (click)="mockGenerate()">
            Générer le contrat
          </button>
        </div>
      </div>
    </div>

    <!-- ================= RIGHT COLUMN ================= -->
    <div class="col-xl-8 col-lg-7">
      <!-- ÉTAT INITIAL -->
      <div *ngIf="!isContratGenerated" class="card h-100 border-0 shadow-sm">
        <div
          class="card-body d-flex flex-column justify-content-center align-items-center text-center"
        >
          <i
            class="ti ti-file-text text-muted mb-3"
            style="font-size: 48px"
          ></i>
          <h5 class="text-muted">Configuration requise</h5>
          <p class="text-muted">
            Veuillez sélectionner un employé et un type de contrat
          </p>
        </div>
      </div>

      <!-- ÉDITEUR -->
      <div *ngIf="isContratGenerated" class="card border-0 shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">Édition du contrat</h5>
        </div>

        <div class="card-body">
        <div class="contract-preview">
<div class="contract-text">
  {{ contractContent }}
</div>
</div>

        </div>

        <div class="card-footer d-flex justify-content-end gap-2 no-print">
  <button class="btn btn-outline-secondary" (click)="printContrat()">
    Imprimer
  </button>
 
</div>

      </div>
    </div>
  </div>
</div>
