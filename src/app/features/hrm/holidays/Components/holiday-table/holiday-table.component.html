
<table class="table datanew table-center mb-0">
  <thead class="thead-light">
    <tr>
      <th class="text-center">Fêtes</th>
      <th class="text-center">الأعياد</th>
      <th class="text-center">Date</th>
      <th class="text-center">Jours</th>
      <th class="text-center">Type</th>
      <th class="text-center">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let h of holidays">
      <td class="text-center fw-medium">{{ h.nameFr }}</td>
      <td class="text-center" dir="rtl">{{ h.nameAr }}</td>
      <td class="text-center">{{ h.date | date:'dd MMM yyyy' }}</td>
      <td class="text-center">{{ h.days }}</td>
      <td class="text-center">{{ h.type }}</td>

      <td class="text-center">
        <ng-container *ngIf="h.type === 'religious'; else dash">
          <a
            href="javascript:void(0)"
            data-bs-toggle="modal"
            data-bs-target="#editHolidayModal"
            (click)="selectHoliday(h)"
          >
            <i class="ti ti-edit"></i>
          </a>
        </ng-container>
        <ng-template #dash>—</ng-template>
      </td>
    </tr>
  </tbody>
</table>

<!-- Modal ici -->


<!-- MODAL -->
<ng-container *ngIf="selectedHoliday">
  <div class="modal fade" id="editHolidayModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Modifier la fête religieuse</h5>
        
        </div>

        <div class="modal-body">
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Fête religieuse</label>
              <input
                class="form-control"
                [value]="selectedHoliday.nameFr"
                disabled
              />
            </div>

            <div class="col-md-6">
              <label class="form-label text-end d-block">العيد الديني</label>
              <input
                class="form-control text-end"
                dir="rtl"
                [value]="selectedHoliday.nameAr"
                disabled
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Date</label>
              <input
                type="date"
                class="form-control"
                [value]="selectedHoliday.date | date : 'yyyy-MM-dd'"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Nombre de jours</label>
              <input
                type="number"
                class="form-control"
                [value]="selectedHoliday.days"
              />
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-white border me-2"
            data-bs-dismiss="modal"
          >
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
