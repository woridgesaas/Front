<div class="table-responsive">
  <table class="table datanew table-center mb-0">
  <thead class="thead-light">
    <tr>
      <th class="text-center">Fêtes</th>
      <th class="text-center">الأعياد</th>
      <th class="text-center">Date</th>
      <th class="text-center">Jours</th>
      <th class="text-center">Type</th>
      <th class="text-center">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let h of holidays">
      <td class="text-center fw-medium">{{ h.nameFr }}</td>
      <td class="text-center" dir="rtl">{{ h.nameAr }}</td>
      <td class="text-center">{{ h.date | date:'dd MMM yyyy' }}</td>
      <td class="text-center">{{ h.days }}</td>
      <td class="text-center">{{ h.type }}</td>

      <td class="text-center">
        <ng-container *ngIf="h.type === 'religious'; else dash">
          <a
            href="javascript:void(0)"
            data-bs-toggle="modal"
            data-bs-target="#editHolidayModal"
            (click)="selectHoliday(h)"
          >
            <i class="ti ti-edit"></i>
          </a>
        </ng-container>
        <ng-template #dash>—</ng-template>
      </td>
    </tr>
  </tbody>
</table>

</div>

<!-- Modal ici -->


<!-- MODAL -->
<ng-container *ngIf="selectedHoliday">
  <div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">

        <!-- HEADER COMMUN -->
        <app-modal-header
          title="Modifier la fête religieuse"
          icon="ti ti-edit"
          (close)="closeModal()">
        </app-modal-header>

        <!-- BODY -->
        <div class="modal-body">
          <form class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Fête religieuse</label>
              <input
                class="form-control"
                [(ngModel)]="selectedHoliday.nameFr"
                name="nameFr"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label text-end d-block">العيد الديني</label>
              <input
                class="form-control text-end"
                dir="rtl"
                [(ngModel)]="selectedHoliday.nameAr"
                name="nameAr"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Date</label>
              <input
                type="date"
                class="form-control"
                [(ngModel)]="selectedHoliday.date"
                name="date"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Nombre de jours</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="selectedHoliday.days"
                name="days"
              />
            </div>

          </form>
        </div>

        <!--  FOOTER COMMUN -->
        <app-modal-footer
          submitText="Enregistrer"
          submitIcon="ti ti-check"
          (cancel)="closeModal()">
        </app-modal-footer>

      </div>
    </div>
  </div>
</ng-container>
