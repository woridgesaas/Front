<div class="container-fluid py-3">
  <!-- En-tête avec titre et filtre -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Jours fériés</h4>
    <span class="badge bg-warning text-dark">⚠️ À confirmer</span>
  </div>


  <div class="row g-3" *ngIf="holidays.length > 0; else showEmptyState">
    <div *ngFor="let h of holidays" class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 shadow-sm border-0" 
           [class.border-warning]="h.status === 'TO_BE_CONFIRMED'"
           [class.bg-light-warning]="h.status === 'TO_BE_CONFIRMED'">
        
        <!-- Header coard-->
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-2">
          <span class="small text-muted">{{ h.date | date:'EEEE d MMMM' }}</span>
          <span *ngIf="h.status === 'TO_BE_CONFIRMED'" 
                class="badge bg-warning text-dark rounded-pill px-2"
                title="Date à confirmer">
            ⏳ À confirmer
          </span>
        </div>

        <div class="card-body">
          <h5 class="card-title mb-1">{{ h.labelFr }}</h5>
          <h6 class="card-subtitle mb-2 text-muted" dir="rtl">{{ h.labelAr }}</h6>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="badge bg-light text-dark rounded-pill">
              <i class="bi bi-calendar"></i> {{ h.date | date:'dd/MM/yyyy' }}
            </span>
            <span class="badge bg-light text-dark rounded-pill">
              <i class="bi bi-clock"></i> {{ h.duration }} jour(s)
            </span>
          </div>
        </div>


        <div *ngIf="!h.isFixed && h.status === 'TO_BE_CONFIRMED'" class="card-footer bg-transparent border-0 pt-0">
          <button class="btn btn-sm btn-outline-primary w-100" (click)="openUpdateModal(h)">
            <i class="bi bi-pencil"></i> Modifier
          </button>
        </div>
      </div>
    </div>
  </div>


<ng-template #showEmptyState>
  <app-empty-state
    [title]="'Aucun jour férié trouvé'"
    [messageWithFilters]="'Aucun résultat ne correspond à vos filtres. Essayez d\'autres critères.'"
    [messageWithoutFilters]="'Aucun jour férié n\'est disponible pour le moment.'"
    [showResetButton]="true"
    [resetButtonLabel]="'Effacer les filtres'"
    (resetFilters)="resetFilters.emit()">
  </app-empty-state>
</ng-template>
</div>
