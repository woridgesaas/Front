  <div class="row mb-4">
      <!-- Aujourd’hui -->
      <div class="col-lg-5 col-md-6 d-flex">
        <div class="card flex-fill">
          <div
            class="card-body d-flex align-items-center justify-content-between"
          >
             <div class="d-flex align-items-center">
              <span class="avatar avatar-lg bg-primary rounded-circle me-3">
                <i class="ti ti-calendar"></i>
              </span>

              <div>
                <p class="fw-semibold mb-1">
                  {{ today | date : "EEEE dd MMMM yyyy" }}
                </p>
                <span class="text-muted fs-13">
                  {{ today | date : "HH:mm:ss" }}
                </span>
              </div>
            </div>

            <div>
              <span class="badge badge-primary badge-sm fw-normal">
                <i class="ti ti-arrow-wave-right-up"></i>
                Aujourd’hui
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Prochain congé -->
      <div class="col-lg-5 col-md-6 d-flex">
        <div class="card flex-fill">
          <div
            class="card-body d-flex align-items-center justify-content-between"
          >
            <div class="d-flex align-items-center overflow-hidden">
              <span class="avatar avatar-lg bg-success rounded-circle me-2">
                <i class="ti ti-moon"></i>
              </span>
              <div class="overflow-hidden">
                <p class="fs-12 fw-medium mb-1 text-truncate">Prochain congé</p>
                <h4 class="mb-0">Aïd Al-Fitr</h4>
              </div>
            </div>

            <div>
              <span class="badge badge-success badge-sm fw-normal">
                <i class="ti ti-calendar"></i>
                20 Mar
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
