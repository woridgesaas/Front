<div class="modal fade show d-block" *ngIf="open">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <!-- Header -->
      <app-modal-header
        title="Ajouter un jour férié"
        icon="ti ti-calendar-event"
        (close)="close()"
      ></app-modal-header>

      <!-- Body -->
      <form (ngSubmit)="submit()">
        <div class="modal-body">
            <div *ngIf="logicError" class="alert alert-important alert-danger mb-3">
              <i class="ti ti-alert-triangle me-2"></i> {{ logicError }}
            </div>
          <!-- Fête searchable -->
         <div class="mb-3 position-relative">
           <label class="form-label">Fête</label>
            <div class="mb-3">
           <input
              type="text"
              class="form-control"
              [class.is-invalid]="fieldErrors['labelFr']"
              [(ngModel)]="holiday.labelFr"
              name="labelFr"
              autocomplete="off"
            />
            <!-- errors -->
            <div class="invalid-feedback" *ngIf="fieldErrors['labelFr']">
              {{ fieldErrors['labelFr'] }}
            </div>
          </div>

        </div>



          <!-- AR -->
          <div class="mb-3">
            <label class="form-label">العيد</label>
           <input
              type="text"
              class="form-control"
              dir="rtl"
              [(ngModel)]="holiday.labelAr"
              name="labelAr"
              [class.is-invalid]="fieldErrors['labelAr']"
              autocomplete="off"
            />
            <div class="invalid-feedback" *ngIf="fieldErrors['labelFr']">
              {{ fieldErrors['labelAr'] }}
            </div>
          </div>

          <!-- Date -->
<div class="mb-3">
  <label class="form-label">Date</label>

  <div class="input-icon position-relative">
    <span class="input-icon-addon">
      <i class="ti ti-calendar text-gray-9"></i>
    </span>

    <input
      type="text"
      class="form-control"
      bsDatepicker
      [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY', adaptivePosition: true }"
      placeholder="jj/mm/aaaa"
      [class.is-invalid]="fieldErrors['date']"
      [(ngModel)]="holiday.date"
      name="date"
    />
    <!-- errors -->
    <div class="invalid-feedback" *ngIf="fieldErrors['date']">
        {{ fieldErrors['date'] }}
      </div>
  </div>
</div>


          <!-- Jours -->
          <div class="mb-3">
            <label class="form-label">Nombre de jours</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="holiday.duration"
              name="duration"
            />
          </div>


        </div>

        <!-- Footer -->
        <app-modal-footer
          submitText="Ajouter"
          submitIcon="ti ti-check"
          (cancel)="close()"
          [disabled]="loading"
        ></app-modal-footer>
      </form>
    </div>
  </div>
</div>
