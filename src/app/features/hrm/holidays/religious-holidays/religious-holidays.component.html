<div class="page-wrapper">
  <div class="content">

    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs
        title="Fêtes religieuses"
        [breadcrumbItems]="breadCrumbItems">
      </app-breadcrumbs>
    </div>
    <!-- /Breadcrumb -->

    <div class="card">
<div class="card-header holidays-header">
  <h5 class="mb-0">Liste des fêtes religieuses</h5>

  <div class="date-filter position-relative">
    <i class="ti ti-calendar calendar-icon"></i>
    <input
      type="text"
      class="form-control date-range-input"
      bsDaterangepicker
      [(ngModel)]="bsRangeValue"
      [bsConfig]="{ adaptivePosition: true }"
      placeholder="dd/mm/yyyy - dd/mm/yyyy"
    />
  </div>
</div>



      <!-- Table -->
      <div class="card-body p-0">
  <div class="table-responsive d-flex justify-content-center">
    <table class="table table-center datatable mb-0 holidays-table">

 <thead class="thead-light">
  <tr>
    <th class="col-fr">fêtes religieuses</th>
    <th class="col-ar">الأعياد الدينية</th>
    <th class="col-date text-center">Date</th>
    <th class="col-days text-center">Nombre de jours</th>
    <th class="col-actions text-center">Actions</th>

  </tr>
</thead>


<tbody>
  <tr>
    <td class="col-fr">Aïd Al-Fitr</td>
    <td class="col-ar" dir="rtl">عيد الفطر</td>
    <td class="col-date text-center">20 mars 2026</td>
    <td class="col-days text-center">2</td>
    <td class="col-actions text-center">
 <button
  class="btn btn-sm btn-outline-primary"
  data-bs-toggle="modal"
  data-bs-target="#editHolidayModal">
  <i class="ti ti-edit"></i>
</button>
</td>
  </tr>

  <tr>
    <td class="col-fr">Aïd Al-Adha</td>
    <td class="col-ar" dir="rtl">عيد الأضحى</td>
    <td class="col-date text-center">27 mai 2026</td>
    <td class="col-days text-center">2</td>
    <td class="col-actions text-center">
<button
  class="btn btn-sm btn-outline-primary"
  data-bs-toggle="modal"
  data-bs-target="#editHolidayModal">
  <i class="ti ti-edit"></i>
</button>


</td>

  </tr>

  <tr>
    <td class="col-fr">1er Moharram</td>
    <td class="col-ar" dir="rtl">رأس السنة الهجرية</td>
    <td class="col-date text-center">17 juin 2026</td>
    <td class="col-days text-center">1</td>
    <td class="col-actions text-center">
<button
  class="btn btn-sm btn-outline-primary"
  data-bs-toggle="modal"
  data-bs-target="#editHolidayModal">
  <i class="ti ti-edit"></i>
</button>

</td>

  </tr>

  <tr>
    <td class="col-fr">Aïd Al-Mawlid</td>
    <td class="col-ar" dir="rtl">عيد المولد النبوي</td>
    <td class="col-date text-center">26 août 2026</td>
    <td class="col-days text-center">1</td>
    <td class="col-actions text-center">
<button
  class="btn btn-sm btn-outline-primary"
  data-bs-toggle="modal"
  data-bs-target="#editHolidayModal">
  <i class="ti ti-edit"></i>
</button>

</td>

  </tr>
</tbody>

          </table>
          <div class="modal fade" id="editHolidayModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Modifier la fête religieuse</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form class="row g-3">

          <div class="col-md-6">
            <label class="form-label">fête religieuse</label>
            <input type="text" class="form-control" value="Aïd Al-Fitr">
          </div>

          <div class="col-md-6">
            <label class="form-label text-end d-block">العيد الديني</label>
            <input type="text" class="form-control text-end" dir="rtl" value="عيد الفطر">
          </div>

          <div class="col-md-6">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" value="2026-03-20">
          </div>

          <div class="col-md-6">
            <label class="form-label">Nombre de jours</label>
            <input type="number" class="form-control" value="2">
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Annuler
        </button>
        <button class="btn btn-primary" data-bs-dismiss="modal">
          Enregistrer
        </button>
      </div>

    </div>
  </div>
</div>

        </div>
      </div>
    </div>

  </div>

  <app-footer></app-footer>
</div>
