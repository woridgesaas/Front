<div class="table-responsive">
  <table
    matSort
    (matSortChange)="sort.emit($event)"
    class="mat-sort table datanew table-center datatable dataTable mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th mat-sort-header="name">Département</th>
        <th mat-sort-header="noOfEmployees">
          Nombre d'employés
        </th>
        <th mat-sort-header="status" class="text-center">
          Statut
        </th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let d of departments">

        <td class="fw-medium text-center">
          {{ d.name }}
        </td>

        <td class="text-center">
          {{ d.noOfEmployees }}
        </td>

        <td class="text-center">
          <span
            class="badge"
            [ngClass]="d.status === 'ACTIVE'
              ? 'badge-success'
              : 'badge-danger'">
            {{ d.status === 'ACTIVE' ? 'Actif' : 'Inactif' }}
          </span>
        </td>

        <td class="text-center">
          <div class="action-icon d-inline-flex align-items-center justify-content-center">
            <a class="me-2" (click)="edit.emit(d)">
              <i class="ti ti-edit"></i>
            </a>
           
          </div>
        </td>

      </tr>

      <tr *ngIf="departments.length === 0">
        <td colspan="4" class="text-center py-3">
          Aucun enregistrement trouvé
        </td>
      </tr>

    </tbody>
  </table>
</div>
