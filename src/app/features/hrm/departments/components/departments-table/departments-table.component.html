<table class="table datanew table-center mb-0">
  <thead class="thead-light">
    <tr>
      <th class="col-department text-center">Département</th>
      <th class="col-employees text-center">Nombre d'employés</th>
      <th class="col-status text-center">Statut</th>
      <th class="col-action text-center">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let d of departments">
      <td class="text-center fw-medium">
        {{ d.Department }}
      </td>

      <td class="col-employees text-center">
        {{ d.NoOfEmployees }}
      </td>

      <td class="col-status text-center">
        <span
          class="badge"
          [ngClass]="d.Status === 'Actif' ? 'badge-success' : 'badge-danger'"
        >
          {{ d.Status }}
        </span>
      </td>

      <td class="col-action text-center">
        <div class="d-inline-flex gap-2">
          <a
            data-bs-toggle="modal"
            data-bs-target="#edit_department"
            (click)="edit.emit(d)"
          >
            <i class="ti ti-edit"></i>
          </a>
          <a
            class="text-danger"
            data-bs-toggle="modal"
            data-bs-target="#deleteModal"
            (click)="delete.emit(d)"
          >
            <i class="ti ti-trash"></i>
          </a>
        </div>
      </td>
    </tr>
  </tbody>
</table>
