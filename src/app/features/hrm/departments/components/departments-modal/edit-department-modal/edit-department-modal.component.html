<!-- Backdrop -->
<div class="modal-backdrop fade show" *ngIf="open"></div>

<!-- Modal -->
<div
  class="modal fade"
  [class.show]="open"
  [class.d-block]="open"
  *ngIf="open"
  tabindex="-1"
>
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <app-modal-header
        title="Modifier département"
        icon="ti ti-edit"
        (close)="onCancel()">
      </app-modal-header>

      <form (ngSubmit)="submit()">
        <div class="modal-body pb-0">

          <!-- Nom -->
          <div class="mb-3">
            <label class="form-label">Nom du département</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="model.name"
              name="name"
              required
            />
          </div>

          <!-- Status -->
          <div class="mb-3">
            <label class="form-label">Statut</label>
            <select
              class="form-select"
              [(ngModel)]="model.status"
              name="status"
              required
            >
              <option value="ACTIVE">Actif</option>
              <option value="INACTIVE">Inactif</option>
            </select>
          </div>

        </div>

        <app-modal-footer
          submitText="Enregistrer"
          submitIcon="ti ti-device-floppy"
          (cancel)="onCancel()">
        </app-modal-footer>

      </form>

    </div>
  </div>
</div>
