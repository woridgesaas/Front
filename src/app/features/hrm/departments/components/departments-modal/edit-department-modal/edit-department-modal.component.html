<div class="modal fade" id="edit_department" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Modifier Département</h4>
        <button
          type="button"
          class="btn-close custom-btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        >
          <i class="ti ti-x"></i>
        </button>
      </div>

      <form (ngSubmit)="submit()">
        <div class="modal-body pb-0">
          <div class="row">

            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Nom du département</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="model.Department"
                  name="department"
                />
              </div>
            </div>

            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Statut</label>
                <select
                  class="form-select"
                  [(ngModel)]="model.Status"
                  name="status"
                >
                  <option value="Actif">Actif</option>
                  <option value="Inactif">Inactif</option>
                </select>
              </div>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light me-2"
            data-bs-dismiss="modal"
          >
            Annuler
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            data-bs-dismiss="modal"
          >
            Enregistrer Département
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
