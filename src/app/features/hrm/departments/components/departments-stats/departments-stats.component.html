<div class="row mb-4">

  <div class="col-lg-4 col-md-6 d-flex">
    <div class="card flex-fill">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div>
          <p class="fs-12 fw-medium mb-1">Total départements</p>
          <h4 class="mb-0">{{ total }}</h4>
        </div>
        <span class="avatar avatar-lg bg-primary rounded-circle">
          <i class="ti ti-building"></i>
        </span>
      </div>
    </div>
  </div>

  <div class="col-lg-4 col-md-6 d-flex">
    <div class="card flex-fill">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div>
          <p class="fs-12 fw-medium mb-1">Départements actifs</p>
          <h4 class="mb-0">{{ active }}</h4>
        </div>
        <span class="avatar avatar-lg bg-success rounded-circle">
          <i class="ti ti-check"></i>
        </span>
      </div>
    </div>
  </div>

  <div class="col-lg-4 col-md-6 d-flex">
    <div class="card flex-fill">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div>
          <p class="fs-12 fw-medium mb-1">Départements inactifs</p>
          <h4 class="mb-0">{{ inactive }}</h4>
        </div>
        <span class="avatar avatar-lg bg-danger rounded-circle">
          <i class="ti ti-x"></i>
        </span>
      </div>
    </div>
  </div>

</div>
