<div class="page-wrapper">
  <div class="content">
    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between mb-3">
      <app-breadcrumbs></app-breadcrumbs>
    </div>

    <!-- ============ KPIS ===================-->  
    <div class="row mb-4 g-3">
      <div class="col-lg-3 col-md-6">
        <app-documents-kpis></app-documents-kpis>
      </div>
    </div>

    

    <!-- ============ TABLEAU ===================-->
    <div class="card">
        <!-- En-tête avec titre et filtres -->
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
            <h5 class="mb-0">
                <i class="ti ti-file-text me-2"></i>
                Demandes de documents
                <small class="text-muted ms-2">({{ totalItems }} résultats)</small>
            </h5>
            </div>
        </div>

        <!-- ============ FILTRES ===================-->
        <div class="card-body border-bottom">
            <div class="filters-bar d-flex align-items-center flex-wrap gap-3 mb-2">
            <!-- Type document -->
            <div style="width: 180px;">
                <select 
                class="form-select form-select-sm" 
                [(ngModel)]="selectedType" 
                (ngModelChange)="applyFilters()">
                <option value="">Type de document</option>
                @for (type of documentTypes; track type) {
                    <option [value]="type">{{ type }}</option>
                }
                </select>
            </div>
             <!-- Date Range -->
            <div class="input-icon" style="width: 220px;">
                <i class="ti ti-calendar"></i>
                <input 
                type="text" 
                class="form-control form-control-sm" 
                bsDaterangepicker 
                [(ngModel)]="dateRange" 
                (ngModelChange)="applyFilters()"
                placeholder="Période">
            </div>
            
            <!-- Statut -->
            <div style="width: 160px;">
                <select 
                class="form-select form-select-sm" 
                [(ngModel)]="selectedStatus" 
                (ngModelChange)="applyFilters()">
                <option value="">Statut</option>
                <option value="pending">En attente</option>
                <option value="in_progress">En traitement</option>
                <option value="ready">Prêt</option>
                <option value="accepted">Acceptée</option>
                <option value="rejected">Refusée</option>
                </select>
            </div>
            
            <!-- Recherche-->
            <div class="input-icon flex-grow-1" style="min-width: 200px; max-width: 300px;">
                <i class="ti ti-search"></i>
                <input 
                type="search" 
                class="form-control form-control-sm" 
                [(ngModel)]="searchText" 
                (ngModelChange)="applyFilters()"
                placeholder="Rechercher employé, document...">
            </div>
            
            <!-- Reset -->
            <button class="btn btn-sm btn-outline-secondary" (click)="resetFilters()" title="Réinitialiser les filtres">
                <i class="ti ti-x me-1"></i>Reset
            </button>
            </div>
        </div>

        <!-- Tableau -->
        <div class="card-body p-0">
            <div class="table-responsive">
            <app-documents-list 
                [data]="getCurrentPageData()"
                (accept)="onAcceptDemande($event)"
                (refuse)="onRefuseDemande($event)"
                (viewJustification)="onViewJustification($event)">
            </app-documents-list>
            </div>
        </div>

        <!-- Pagination -->
        @if (totalItems > 0) {
                <app-custom-pagination
                (pageChanged)="onPageChange($event)">
                </app-custom-pagination>
        }
        </div>
    
    
  </div>
  <!-- ============ MODALS ===================-->
    <!-- Modal acceptation request -->
    @if(showAcceptModal){
        <app-accept-modal [data]="selectedDemande"></app-accept-modal>
    }
    @if(showRejectModal){
        <app-reject-modal (cancelled)="handlleRejectModalClosed()" (refused)="rejectRequest($event)" [data]="selectedDemande"></app-reject-modal>
    }
    @if(showDetailsModal){
        <app-details-modal (close)="handlleDetailsModalClosed()" [data]="selectedDemande"></app-details-modal>
    }
</div>
