<div class="page-wrapper">
  <div class="content">
    <!-- Breadcrumb -->
    <div class="d-md-flex align-items-center justify-content-between mb-3">
      <app-breadcrumbs></app-breadcrumbs>
    </div>

    <!-- KPI -->
    <app-justification-stats [justifications]="employees">
    </app-justification-stats>

    <!-- Card -->
    <div class="card">
      <div
        class="card-header d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0">Liste des justifications</h5>

        <app-justification-filters
          [departments]="departments"
          [dateRange]="bsRangeValue"
          (dateRangeChange)="bsRangeValue = $event; applyFilters()"
          (departmentChange)="filterByDepartment($event)"
          (searchChange)="onSearch($event)"
        >
        </app-justification-filters>
      </div>

      <app-justification-table
        [employees]="employees"
        (openProfile)="goToProfile($event)"
        (validate)="validate($event)"
        (refuse)="refuse($event)"
        (download)="downloadDocument($event)"
      >
      </app-justification-table>
    </div>
  </div>

  <app-footer></app-footer>
</div>
