<div class="page-wrapper">
  <div class="content">
    <!-- HEADER -->
    <div class="d-md-flex align-items-center justify-content-between mb-3">
      <app-breadcrumbs></app-breadcrumbs>

      <button class="btn btn-primary" (click)="openAddModal = true">
        <i class="ti ti-circle-plus me-2"></i>
        Ajouter Promotion
      </button>
    </div>

    <!-- KPI -->
    <app-promotions-stats [promotions]="filteredPromotions">
    </app-promotions-stats>

    <!-- CARD -->
    <div class="card mb-0">
      <div
        class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3"
      >
        <h5 class="mb-0">Liste des promotions</h5>

        <!-- FILTERS -->
        <app-promotions-filters
          [(searchValue)]="searchValue"
          [(dateRange)]="dateRange"
          (searchValueChange)="applyFilters()"
          (dateRangeChange)="applyFilters()"
        >
        </app-promotions-filters>
      </div>

      <div class="card-body p-0">
        <!-- TABLE -->
        <app-promotions-table
          [promotions]="filteredPromotions"
          (edit)="openEdit($event)"
          (remove)="openDelete($event)"
          (sort)="sortData($event)"
        >
        </app-promotions-table>

        <!-- ADD MODAL -->
        <app-add-promotion-modal
  [open]="openAddModal"
  (submitPromotion)="addPromotion($event)"
  (cancel)="openAddModal = false"
>
</app-add-promotion-modal>

        <!-- EDIT MODAL -->
        <app-edit-promotion-modal
          [open]="openEditModal"
          [promotion]="selectedPromotion!"
          (cancel)="openEditModal = false"
          (update)="updatePromotion($event)"
        >
        </app-edit-promotion-modal>

        <!-- DELETE MODAL -->
        <app-confirm-delete
          modalId="deleteModal"
          title="Supprimer Promotion"
          [message]="
            selectedItem
              ? 'Êtes-vous sûr de vouloir supprimer la promotion de ' +
                selectedItem.PromotedEmployee +
                ' ?'
              : ''
          "
          [item]="selectedItem"
          (confirm)="deleteItem()"
        >
        </app-confirm-delete>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <app-footer></app-footer>
</div>
