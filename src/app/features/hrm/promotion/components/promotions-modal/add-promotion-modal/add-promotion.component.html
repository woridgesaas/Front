<div class="modal-backdrop fade show" *ngIf="open"></div>

<div
  class="modal fade"
  [class.show]="open"
  [class.d-block]="open"
  *ngIf="open"
  tabindex="-1"
>
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <!-- HEADER -->
      <app-modal-header
        title="Ajouter une promotion"
        icon="ti ti-trending-up"
        (close)="onCancel()"
      ></app-modal-header>

      <!-- FORM -->
      <form (ngSubmit)="submit()">

        <div class="modal-body pb-0">
          <div class="row">

            <!-- CIN -->
            <div class="col-md-12 mb-3">
              <label class="form-label">CIN de l’employé</label>
<div *ngIf="loading" class="text-primary mt-2">
   Chargement employé...
</div>              <input
                type="text"
                class="form-control"
                [(ngModel)]="cin"
                name="cin"
                required
(keyup)="cinChanged.next(cin)"
              />

              <div *ngIf="errorMessage" class="text-danger mt-2">
                {{ errorMessage }}
              </div>
            </div>

            <!-- EMPLOYÉ -->
            <div class="col-md-12 mb-3">
              <label class="form-label">Employé promu</label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="model.promotedEmployee"
                name="employee"
                disabled
              />
            </div>

            <!-- DEPARTEMENT -->
           <div class="col-md-12 mb-3">
  <label class="form-label">Département</label>

  <input
    type="text"
    class="form-control"
    [value]="model.department"
    disabled
  />
</div>

            <!-- ANCIEN POSTE -->
            <div class="col-md-12 mb-3">
              <label class="form-label">Ancien poste</label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="model.designationFrom"
                name="from"
                disabled
              />
            </div>

            <!-- NOUVEAU POSTE -->
            <div class="col-md-12 mb-3">

              <label class="form-label">Nouveau poste</label>

              <div class="dropdown">

                <button
                  type="button"
                  class="btn btn-outline-secondary d-flex justify-content-between w-100"
                  (click)="isPostOpen = !isPostOpen"
                >
                  {{
                    model.designationTo
                      ? model.designationTo
                      : "Sélectionner un poste"
                  }}
                  <i class="ti ti-chevron-down"></i>
                </button>

                <ul class="dropdown-menu show w-100" *ngIf="isPostOpen">

                 <li *ngFor="let post of posts">

  <button
    type="button"
    class="dropdown-item"
    [disabled]="post.name === model.designationFrom"
    (click)="selectPosition(post.name)"
  >
    {{ post.name }}
  </button>

</li>

                  <li *ngIf="posts.length === 0">
                    <span class="dropdown-item text-muted">
                      Aucun poste disponible
                    </span>
                  </li>

                </ul>

              </div>
            </div>

            <!-- SALAIRES -->

            <div class="col-md-6 mb-3">
              <label class="form-label">Ancien salaire (MAD)</label>

              <input
                type="number"
                class="form-control"
                [(ngModel)]="model.oldSalary"
                name="oldSalary"
                disabled
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Prime / Augmentation (MAD)</label>

              <input
                type="number"
                class="form-control"
                [(ngModel)]="model.bonus"
                name="bonus"
                (ngModelChange)="calculateNewSalary()"
              />
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Nouveau salaire (MAD)</label>

              <input
                type="number"
                class="form-control"
                [value]="model.newSalary"
                disabled
              />
            </div>
            <div class="col-md-12 mb-3">
  <label class="form-label">Date de promotion</label>

  <div class="input-icon position-relative">
    <span class="input-icon-addon">
      <i class="ti ti-calendar text-gray-7"></i>
    </span>

    <input
      type="text"
      class="form-control"
      bsDatepicker
      [bsConfig]="{ adaptivePosition: true }"
      [(ngModel)]="promotionDate"
      name="promotionDate"
      placeholder="jj/mm/aaaa"
      required
    />
  </div>
</div>

          </div>
        </div>

        <!-- FOOTER -->

        <app-modal-footer
          submitText="Ajouter promotion"
          submitIcon="ti ti-check"
          (cancel)="onCancel()"
        ></app-modal-footer>

      </form>

    </div>
  </div>
</div>
