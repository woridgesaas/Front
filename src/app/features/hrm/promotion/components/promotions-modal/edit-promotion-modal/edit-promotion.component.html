<div class="modal-backdrop fade show" *ngIf="open"></div>
  
<div
  class="modal fade"
  [class.show]="open"
  [class.d-block]="open"
  *ngIf="open"
  tabindex="-1"
>
<div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">

      <!-- HEADER -->
      <app-modal-header
        title="Modifier la promotion"
        icon="ti ti-edit"
        (close)="onCancel()">
      </app-modal-header>

      <!-- FORM -->
      <form (ngSubmit)="submit()">
        <div class="modal-body pb-0">
          <div class="row">

            <div class="col-md-12 mb-3">
              <label class="form-label">Employé</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="form.promotedEmployee"
                name="employee"
                disabled />
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Département</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="form.department"
                name="department"
                disabled />
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Ancien poste</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="form.designationFrom"
                name="from"
                disabled />
            </div>

                  <div class="col-md-12 mb-3">
  <label class="form-label">Nouveau poste</label>

  <div class="dropdown">

    <button
      type="button"
      class="btn btn-outline-secondary d-flex justify-content-between w-100"
      (click)="isPostOpen = !isPostOpen"
    >
      {{ form.designationTo || "Sélectionner un poste" }}
      <i class="ti ti-chevron-down"></i>
    </button>

    <ul class="dropdown-menu show w-100" *ngIf="isPostOpen">

      <li *ngFor="let post of posts">

        <button
          type="button"
          class="dropdown-item"
          [disabled]="post.name === form.designationFrom"
          (click)="selectPosition(post)"
        >
          {{ post.name }}
        </button>

      </li>

    </ul>
  </div>
</div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Ancien salaire (MAD)</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="form.oldSalary"
                name="oldSalary"
                disabled />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Prime / Augmentation (MAD)</label>
             <input
  type="number"
  class="form-control"
  [(ngModel)]="form.bonus"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onBonusChange()"
/>
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Nouveau salaire (MAD)</label>
              <input
                type="number"
                class="form-control"
                [value]="form.newSalary"
                disabled />
            </div>

          <div class="col-md-12 mb-3">
  <label class="form-label">Date de promotion</label>

  <div class="input-icon position-relative">
    <span class="input-icon-addon">
      <i class="ti ti-calendar text-gray-9"></i>
    </span>

    <input
      type="text"
      class="form-control"
      bsDatepicker
      [bsConfig]="{ adaptivePosition: true }"
      [(ngModel)]="promotionDate"
      name="promotionDate"
      placeholder="jj/mm/aaaa"
      required
    />
  </div>
</div>

          </div>
        </div>

        <!-- FOOTER -->
        <app-modal-footer
  submitText="Enregistrer"
  submitIcon="ti ti-check"
  [disabled]="loading"
  (cancel)="onCancel()">
</app-modal-footer>

      </form>

    </div>
  </div></div>
