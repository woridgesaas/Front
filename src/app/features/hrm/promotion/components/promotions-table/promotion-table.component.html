<div class="table-responsive">
  <table
    matSort
    (matSortChange)="sort.emit($event)"
    class="mat-sort table table-hover table-center mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th mat-sort-header="PromotedEmployee">Employé</th>
        <th mat-sort-header="Department">Département</th>
        <th mat-sort-header="DesignationFrom">Ancien poste</th>
        <th mat-sort-header="DesignationTo">Nouveau poste</th>
        <th mat-sort-header="NewSalary">Nouveau salaire</th>
        <th mat-sort-header="PromotionDate">Date</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of promotions; trackBy: trackById">

        <td>{{ p.PromotedEmployee || '-' }}</td>
        <td>{{ p.Department || '-' }}</td>
        <td>{{ p.DesignationFrom || '-' }}</td>
        <td>{{ p.DesignationTo || '-' }}</td>

        <td>
          {{ p.NewSalary | number:'1.0-2' }} MAD
        </td>

        <td>
          {{ p.PromotionDate | date:'dd/MM/yyyy' }}
        </td>

        <td class="text-center">
          <div class="d-inline-flex align-items-center gap-2">

            <button
              type="button"
              class="btn btn-sm btn-link text-primary"
              (click)="edit.emit(p)"
              aria-label="Modifier">
              <i class="ti ti-edit"></i>
            </button>

            <button
              type="button"
              class="btn btn-sm btn-link text-danger"
              (click)="remove.emit(p)"
              aria-label="Supprimer">
              <i class="ti ti-trash"></i>
            </button>

          </div>
        </td>
      </tr>

      <tr *ngIf="promotions.length === 0">
        <td colspan="7" class="text-center py-4 text-muted">
          Aucune promotion trouvée
        </td>
      </tr>
    </tbody>
  </table>
</div>
