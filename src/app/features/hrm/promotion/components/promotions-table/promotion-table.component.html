<div class="table-responsive">
  <table
    matSort
    (matSortChange)="sort.emit($event)"
    class="mat-sort table datanew table-center datatable dataTable mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th mat-sort-header="PromotedEmployee">Employé</th>
        <th mat-sort-header="Department">Département</th>
        <th mat-sort-header="DesignationFrom">Ancien poste</th>
        <th mat-sort-header="DesignationTo">Nouveau poste</th>
        <th mat-sort-header="NewSalary">Nouveau salaire</th>
        <th mat-sort-header="PromotionDate">Date</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of promotions">
        <td>{{ p.PromotedEmployee }}</td>
        <td>{{ p.Department }}</td>
        <td>{{ p.DesignationFrom }}</td>
        <td>{{ p.DesignationTo }}</td>
        <td>{{ p.NewSalary }} MAD</td>
        <td>{{ p.PromotionDate }}</td>

        <!-- ACTIONS -->
        <td class="text-center">
          <div
            class="action-icon d-inline-flex align-items-center justify-content-center gap-2"
          >
            <button
              type="button"
              class="btn btn-link p-0 text-primary"
              (click)="edit.emit(p)"
              aria-label="Modifier"
            >
              <i class="ti ti-edit"></i>
            </button>

            <button
              type="button"
              class="btn btn-link p-0 text-danger"
              data-bs-toggle="modal"
              data-bs-target="#deleteModal"
              (click)="remove.emit(p)"
              aria-label="Supprimer"
            >
              <i class="ti ti-trash"></i>
            </button>
          </div>
        </td>
      </tr>

      <tr *ngIf="promotions.length === 0">
        <td colspan="7" class="text-center py-3">
          Aucun enregistrement trouvé
        </td>
      </tr>
    </tbody>
  </table>
</div>
