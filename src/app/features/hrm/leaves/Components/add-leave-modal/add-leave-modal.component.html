<div class="modal fade" id="add_leave" #addLeaveModal>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Ajouter Congé</h4>
        <button
          type="button"
          class="btn-close custom-btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        >
          <i class="ti ti-x"></i>
        </button>
      </div>

      <form (ngSubmit)="submit()">
        <div class="modal-body pb-0">
          <div class="row">
            <!-- Type de congé -->
            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Type de congé</label>
                <mat-select
                  placeholder="Sélectionner"
                  class="select custom-mat-select"
                  [(ngModel)]="selectedLeaveType"
                  name="leaveType"
                  (selectionChange)="onLeaveTypeChange($event.value)"
                >
                  <mat-option [value]="LeaveType.ANNUAL"
                    >Congé annuel</mat-option
                  >
                  <mat-option [value]="LeaveType.MEDICAL"
                    >Congé maladie</mat-option
                  >
                  <mat-option [value]="LeaveType.EXCEPTIONAL"
                    >Congé exceptionnel</mat-option
                  >
                </mat-select>
              </div>
            </div>

            <!-- Du -->
            <div class="col-md-6">
              <div class="mb-3 ngx-date3">
                <label class="form-label">Du</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date3"
                    [bsConfig]="{
                      adaptivePosition: true,
                      dateInputFormat: 'DD/MM/YYYY'
                    }"
                    placeholder="dd/mm/yyyy"
                    [(ngModel)]="startDate"
                    name="startDate"
                    (bsValueChange)="onStartDateChange($event)"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- Au -->
            <div class="col-md-6">
              <div class="mb-3 ngx-date4">
                <label class="form-label">Au</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date4"
                    [bsConfig]="{
                      adaptivePosition: true,
                      dateInputFormat: 'DD/MM/YYYY'
                    }"
                    placeholder="dd/mm/yyyy"
                    [(ngModel)]="endDate"
                    name="endDate"
                    (bsValueChange)="onEndDateChange($event)"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- Nbr de jours -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Nbr de jours</label>
                <input
                  type="text"
                  class="form-control"
                  [value]="isSimulating ? '...' : numberOfDays ?? ''"
                  disabled
                />
              </div>
            </div>

            <!-- Jours restants -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Jours restants</label>
                <input
                  type="text"
                  class="form-control"
                  [value]="isSimulating ? '...' : remainingBalance ?? ''"
                  disabled
                />
              </div>
            </div>

            <!-- Justificatif -->
            <div class="col-md-12" *ngIf="showJustificatif">
              <div class="mb-3">
                <label class="form-label"
                  >Justificatif <span class="text-danger">*</span></label
                >
                <input
                  type="file"
                  class="form-control"
                  (change)="onFileSelected($event)"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light me-2"
            data-bs-dismiss="modal"
          >
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
