<div class="row mb-4 g-3">
  <div class="col-xl-3 col-md-6">
    <app-kpi-card
      title="Congés annuels"
      [value]="annualCount"
      icon="ti ti-calendar-event"
      color="primary">
    </app-kpi-card>
  </div>
  <div class="col-xl-3 col-md-6">
    <app-kpi-card
      title="Total des congés"
      [value]="totalCount"
      icon="ti ti-briefcase"
      color="warning">
    </app-kpi-card>
  </div>
  <div class="col-xl-3 col-md-6">
    <app-kpi-card
      title="Congés restants"
      [value]="remainingBalance"
      icon="ti ti-hourglass"
      color="success">
    </app-kpi-card>
  </div>
</div>
