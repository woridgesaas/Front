<!-- Edit Employee Leaves -->
<div class="modal fade" id="edit_leave">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Modifier Congé</h4>
        <button
          type="button"
          class="btn-close custom-btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        >
          <i class="ti ti-x"></i>
        </button>
      </div>
      <form (ngSubmit)="submit()">
        <div class="modal-body pb-0">
          <div class="row">
            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Type de congé</label>

                <mat-select
                  placeholder="Sélectionner"
                  class="select custom-mat-select"
                  [(ngModel)]="selectedLeaveType"
                  (selectionChange)="onLeaveTypeChange($event.value)"
                >
                  <mat-option value="annuel">Congé annuel</mat-option>
                  <mat-option value="medical">Congé maladie</mat-option>
                  <mat-option value="exceptionnel"
                    >Congé exceptionnel</mat-option
                  >
                </mat-select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3 ngx-date5">
                <label [htmlFor]="" class="form-label">Du</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date5"
                    [bsConfig]="{ adaptivePosition: true }"
                    placeholder="dd/mm/yyyy"
                    value="02-05-2024"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3 ngx-date6">
                <label [htmlFor]="" class="form-label">Au</label>
                <div class="input-icon-end position-relative">
                  <input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date6"
                    [bsConfig]="{ adaptivePosition: true }"
                    placeholder="dd/mm/yyyy"
                    value="02-05-2024"
                  />
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-7"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Nbr de jours</label>
                <input type="text" class="form-control" value="01" disabled />
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Jours restants</label>
                <input type="text" class="form-control" value="07" disabled />
              </div>
            </div>
            <!-- Justificatif -->
            <div class="col-md-12" *ngIf="showJustificatif">
              <div class="mb-3">
                <label class="form-label">Justificatif</label>
                <input
                  type="file"
                  class="form-control"
                  (change)="onFileSelected($event)"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light me-2"
            data-bs-dismiss="modal"
          >
            Annuler
          </button>
          <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- /Edit Employee Leaves -->
