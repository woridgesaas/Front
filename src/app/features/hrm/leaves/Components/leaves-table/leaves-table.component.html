<div class="table-responsive">
  <table
    matSort
    (matSortChange)="sort.emit($event)"
    class="mat-sort table datanew table-center datatable dataTable mb-0"
  >
    <thead class="thead-light">
      <tr>
        <th mat-sort-header="LeaveType">Type de congé</th>
        <th mat-sort-header="From">Du</th>
        <th mat-sort-header="To">Au</th>
        <th mat-sort-header="ApprovedBy">Approuvé par</th>
        <th mat-sort-header="NoOfDays">Nb de jours</th>
        <th mat-sort-header="Status">Statut</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (data of tableData; track data) {
      <tr>
        <!-- Type -->
        <td>
          <div class="d-flex align-items-center">
            <p class="fs-14 fw-medium mb-0">{{ data.LeaveType }}</p>
            <a class="ms-2" href="javascript:void(0);">
              <i class="ti ti-info-circle text-info"></i>
            </a>
          </div>
        </td>

        <td>{{ data.From }}</td>
        <td>{{ data.To }}</td>

        <!-- Approved by -->
        <td>
          <div class="d-flex align-items-center file-name-icon">
            <a class="avatar avatar-md avatar-rounded">
              <img
                src="assets/img/users/{{ data?.Image }}"
                class="img-fluid"
                alt="img"
              />
            </a>
            <div class="ms-2">
              <h6 class="fw-medium mb-0">{{ data.ApprovedBy }}</h6>
              <span class="fs-12">{{ data.Roll }}</span>
            </div>
          </div>
        </td>

        <td>{{ data.NoOfDays }}</td>

        <!-- Status -->
        <td>
          <span class="d-inline-flex align-items-center">
            <span
              class="rounded-circle me-2"
              [ngClass]="statusBg[data.Status]"
              style="width: 14px; height: 14px"
            >
            </span>
            {{ data.Status }}
          </span>
        </td>

        <!-- Actions -->
        <td>
          <div class="action-icon d-inline-flex align-items-center">
            <a
              href="#"
              class="me-2"
              title="Modifier"
              *ngIf="canEditLeave(data.Status)"
              data-bs-toggle="modal"
              data-bs-target="#edit_leave"
              (click)="$event.preventDefault(); edit.emit(data)"
            >
              <i class="ti ti-edit"></i>
            </a>

            <a
              href="#"
              title="Supprimer"
              *ngIf="canDeleteLeave(data.Status)"
              data-bs-toggle="modal"
              data-bs-target="#confirmDeleteModal"
              (click)="$event.preventDefault(); delete.emit(data)"
            >
              <i class="ti ti-trash"></i>
            </a>

            <span
              *ngIf="!canEditLeave(data.Status) && !canDeleteLeave(data.Status)"
              class="text-muted"
              >-</span
            >
          </div>
        </td>
      </tr>
      } @if (tableData.length === 0) {
      <tr>
        <td colspan="7">
          <h5 class="no-record">Aucun enregistrement trouvé</h5>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
