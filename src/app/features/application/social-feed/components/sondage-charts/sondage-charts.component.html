<!-- Parent -->
<div class="row">
  <!-- Carte 1 -->
  <div class="col-xl-4 col-lg-6 col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <span class="avatar rounded-circle bg-primary mb-2">
              <i class="ti ti-chart-pie fs-16"></i>
            </span>
            <h6 class="fs-13 fw-medium text-default mb-1">{{stats[0].title}}</h6>
            <h3 class="mb-0">{{stats[0].value}}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Carte 2 -->
  <div class="col-xl-4 col-lg-6 col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <span class="avatar rounded-circle bg-success mb-2">
              <i class="ti ti-chart-bar fs-16"></i>
            </span>
            <h6 class="fs-13 fw-medium text-default mb-1">{{stats[1].title}}</h6>
            <h3 class="mb-0">{{stats[1].value}}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Carte 3 -->
  <div class="col-xl-4 col-lg-6 col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <span class="avatar rounded-circle bg-secondary mb-2">
              <i class="ti ti-users fs-16"></i>
            </span>
            <h6 class="fs-13 fw-medium text-default mb-1">{{stats[2].title}}</h6>
            <h3 class="mb-0">{{stats[2].value}}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
