<div class="page-wrapper">
  <div class="content">

    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs></app-breadcrumbs>
    </div>

    <div class="chat-wrapper">

  <!-- SIDEBAR : Liste des contacts et groupes -->
  <div class="chat-sidebar" [class.show]="isSidebarVisible">

    <!-- Recherche -->
    <div class="sidebar-header">
      <h5>Messages</h5>
      <div class="search-box">
        <i class="ti ti-search"></i>
        <input
          type="text"
          placeholder="Rechercher..."
          [(ngModel)]="searchQuery"
         >
      </div>
    </div>

    <!-- ONGLETS Contacts/Groupes -->
    <div class="sidebar-tabs">
      <button [class.active]="activeTab === 'contacts'"
              (click)="switchTab('contacts')">
        <i class="ti ti-user"></i> Contacts
      </button>
      <button [class.active]="activeTab === 'groups'"
              (click)="switchTab('groups')">
        <i class="ti ti-users"></i> Groupes
      </button>
    </div>

    <!-- Liste selon l'onglet actif -->
    <div class="items-list">
        @if (activeTab === 'contacts') {
          <app-contacts-list
            [contacts]="contacts"
            [selectedContact]="selectedContact"
            [searchQuery]="searchQuery"
            (contactSelected)="onContactSelected($event)">
          </app-contacts-list>
        }
        
        @if (activeTab === 'groups') {
          <app-groups-list
            [groups]="groups"
            [selectedGroup]="selectedGroup"
            [searchQuery]="searchQuery"
            (groupSelected)="onGroupSelected($event)">
          </app-groups-list>
        }
  </div>
  </div>

  <!-- ZONE PRINCIPALE : Chat -->
  <div class="chat-main">

    <!-- En-tête du chat -->
    @if (selectedItem) {
       <app-chat-header
        [activeTab]="activeTab"
        [selectedContact]="selectedContact"
        [selectedGroup]="selectedGroup"
        [currentUser]="currentUser"
        (back)="deselectItem()"
        (manageGroup)="openGroupManagement()">
    </app-chat-header>

      <!-- Messages envoi de selectedContact pour afficher le avatar :)-->
      <div class="messages-container">
         <app-chat-messages
          [messages]="messages"
          [selectedContact]="selectedContact"        
          [currentUser]="currentUser"
          [activeTab]="activeTab">
        </app-chat-messages>
      </div>

      <!-- Zone de saisie -->
      <app-chat-footer 
        (messageSent)="onMessageSent($event)"
        (enterPressed)="onEnterKeyPressed($event)"
      ></app-chat-footer>

    } @else {
      <!-- Welcome screen if nothing is selected -->
      <app-welcome-screen [activeTab]="activeTab"></app-welcome-screen>
    }
  </div>
</div>
  </div>
</div>
<!--Modal de détaille d'un group :)-->
<app-details-group-modal></app-details-group-modal>
