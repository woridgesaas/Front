<div class="page-wrapper">
  <div class="content">
    <!-- Fil d'Ariane -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs></app-breadcrumbs>
      <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
        <div class="mb-2">
          <a href="javascript:void(0);" 
             data-bs-toggle="modal" 
             data-bs-target="#add_event" 
             class="btn btn-primary d-flex align-items-center">
            <i class="ti ti-circle-plus me-2"></i>Ajouter un événement
          </a>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Sidebar Calendrier -->
      <div class="col-xxl-3 col-xl-4">
        <div class="card">
          <div class="card-body p-3 p-inlines">
            <div class="border-bottom prime-cal pb-2 mb-4">
				 <!-- Filtres rapides -->
				<div class="mb-4">
				<h6 class="mb-3">Filtrer par type</h6>
				<div class="d-flex flex-wrap gap-2">
					@for (filter of eventTypes; track filter.value) {
					<button class="btn btn-sm btn-outline-secondary" 
							[class.active]="activeFilter === filter.value"
							(click)="applyFilter(filter.value)">
						<i [class]="filter.icon + ' me-1'"></i>{{filter.label}}
					</button>
					}
				</div>
				</div>
            </div>

            <!-- My évents -->
			<app-my-events [myEvents]="myEvents"></app-my-events>

            <!-- Public events-->
			<app-public-events [publicEvents]="filtredPublicEvents"></app-public-events>
          </div>
        </div>
      </div>
      <!-- /Sidebar Calendrier -->

      <!-- Zone principale du calendrier -->
     <div class="col-xxl-9 col-xl-8 theiaStickySidebar">
			<div class="card border-0">
				<div class="card-header border-0 d-flex justify-content-between align-items-center">
				<h5 class="mb-0">
					<i class="ti ti-calendar-stats me-2 text-primary"></i>
					Calendrier des activités
				</h5>
				</div>
				<div class="card-body">
				<app-custom-calendar 
					[events]="calendarEvents"
					(eventClicked)="onEventClick($event)"
					(dayClicked)="onDayClick($event)">
				</app-custom-calendar>
				</div>
			</div>
		</div>
    </div>
  </div>
</div>

<!-- Add New Event -->
<app-add-event-modal (onEventCreated)="AddEvent($event)"></app-add-event-modal>
<!-- /Add New Event -->

<!-- Event Details Modal-->
<app-event-details [eventDetails]="eventDetails" [showEventDetailsModal]="showEventDetailsModal" (modalClosed)="handleEventDetailsClose()"></app-event-details>
<!-- /Event Details Modal-->

<!-- Backdrop effect si true we add this div to dom -->
 <ng-container *ngIf="showEventDetailsModal">
   <div (click)="handleEventDetailsClose()" (keypress)="handleEventDetailsClose()" tabindex="1" class="modal-backdrop fade show"></div>
 </ng-container>
