<div class="page-wrapper">
  <div class="content">
    <!-- Fil d'Ariane -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs></app-breadcrumbs>
      <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
        <div class="mb-2">
          <a href="javascript:void(0);" 
             data-bs-toggle="modal" 
             data-bs-target="#add_event" 
             class="btn btn-primary d-flex align-items-center">
            <i class="ti ti-circle-plus me-2"></i>Ajouter un événement
          </a>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Sidebar Calendrier -->
      <div class="col-xxl-3 col-xl-4">
        <div class="card">
          <div class="card-body p-3 p-inlines">
            <div class="border-bottom prime-cal pb-2 mb-4">
				 <!-- Filtres rapides -->
				<div class="mb-4">
				<h6 class="mb-3">Filtrer par type</h6>
				<div class="d-flex flex-wrap gap-2">
					@for (filter of eventTypes; track filter.value) {
					<button class="btn btn-sm btn-outline-secondary" 
							[class.active]="activeFilter === filter.value"
							(click)="applyFilter(filter.value)">
						<i [class]="filter.icon + ' me-1'"></i>{{filter.label}}
					</button>
					}
				</div>
				</div>
            </div>

            <!-- My évents -->
			<app-my-events [myEvents]="myEvents"></app-my-events>

            <!-- Public events-->
			<app-public-events [publicEvents]="filtredPublicEvents"></app-public-events>
          </div>
        </div>
      </div>
      <!-- /Sidebar Calendrier -->

      <!-- Zone principale du calendrier -->
     <div class="col-xxl-9 col-xl-8 theiaStickySidebar">
			<div class="card border-0">
				<div class="card-header border-0 d-flex justify-content-between align-items-center">
				<h5 class="mb-0">
					<i class="ti ti-calendar-stats me-2 text-primary"></i>
					Calendrier des activités
				</h5>
				</div>
				<div class="card-body">
				<app-custom-calendar 
					[events]="calendarEvents"
					(eventClicked)="onEventClick($event)"
					(dayClicked)="onDayClick($event)">
				</app-custom-calendar>
				</div>
			</div>
		</div>
    </div>
  </div>
</div>

<!-- Add New Event -->
<div class="modal fade" id="add_event">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title">Add New Event</h4>
				<button type="button" class="btn-close custom-btn-close" data-bs-dismiss="modal" aria-label="Close">
					<i class="ti ti-x"></i>
				</button>
			</div>
			<form >
				<div class="modal-body">
					<div class="row">
						<div class="col-12">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Event Name</label>
								<input type="text" class="form-control">
							</div>
						</div>
						<div class="col-12">
							<div class="mb-3 ngx-date">
								<label [htmlFor]="" class="form-label">Event Date</label>
								<div class="input-icon-end position-relative">
									<input
                    type="text"
                    class="form-control datetimepicker"
                    bsDatepicker
                    container=".ngx-date"
                    [bsConfig]="{ adaptivePosition: true }"
                    placeholder="dd/mm/yyyy"
                    value="02-05-2024"
                  />
									<span class="input-icon-addon">
										<i class="ti ti-calendar text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Start Time</label>
								<div class="input-icon-end position-relative">
									<p-datepicker
                    inputId="calendar-timeonly"
                    placeholder="Choose"
                    inputStyleClass="form-control timepicker w-100"
                    [(ngModel)]="addtime2"
                    [timeOnly]="true"
                    [ngModelOptions]="{ standalone: true }"
                    [hourFormat]="'12'"
                  />
									<span class="input-icon-addon">
										<i class="ti ti-clock text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">End Time</label>
								<div class="input-icon-end position-relative">
                  <p-datepicker
                  inputId="calendar-timeonly"
                  placeholder="Choose"
                  inputStyleClass="form-control timepicker w-100"
                  [(ngModel)]="addtime"
                  [timeOnly]="true"
                  [ngModelOptions]="{ standalone: true }"
                  [hourFormat]="'12'"
                />
									<span class="input-icon-addon">
										<i class="ti ti-clock text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Event Location</label>
								<input type="text" class="form-control">
							</div>
							<div class="mb-0">
								<label [htmlFor]="" class="form-label">Descriptions</label>
								<textarea class="form-control" rows="3"></textarea>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
					<button type="button" data-bs-dismiss="modal" class="btn btn-primary">Add Event</button>
				</div>
			</form>
		</div>
	</div>
</div>
<!-- /Add New Event -->

<!-- Event Details Modal-->
<app-event-details [eventDetails]="eventDetails" [showEventDetailsModal]="showEventDetailsModal" (modalClosed)="handleEventDetailsClose()"></app-event-details>
<!-- /Event Details Modal-->

<!-- Backdrop effect si true we add this div to dom -->
 <ng-container *ngIf="showEventDetailsModal">
   <div (click)="handleEventDetailsClose()" (keypress)="handleEventDetailsClose()" tabindex="1" class="modal-backdrop fade show"></div>
 </ng-container>
