<div class="modal fade" id="add_event">
    
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
            <app-modal-header (close)="closeModal()" [icon]="'ti ti-calendar-plus'" [title]="'Ajouter un événement'"></app-modal-header>
			<form #form="ngForm" (ngSubmit)="onSubmit(form)">
				<div class="modal-body">
					<div class="row">
						<div class="col-12">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Titre d'événement</label>
								<input required ngModel name="title" type="text" class="form-control">
							</div>
						</div>
						<div class="col-12">
							<div class="mb-3 ngx-date">
								<label  class="form-label">Date d'événement</label>
								<div class="input-icon-end position-relative">
									<input
                                    name="date"
									type="text"
									class="form-control datetimepicker"
									bsDatepicker
                                    ngModel
									container=".ngx-date"
									placeholder="dd/mm/yyyy"
									required
                  				/>
									<span class="input-icon-addon">
										<i class="ti ti-calendar text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Heure de début</label>
								<div class="input-icon-end position-relative">
									<p-datepicker
                                    name="start"
                                    required
                                    ngModel
									inputId="calendar-timeonly"
									placeholder="Choisir"
									inputStyleClass="form-control timepicker w-100"
									[timeOnly]="true"
									[hourFormat]="'24'"
                 				 />
									<span class="input-icon-addon">
										<i class="ti ti-clock text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="mb-3">
								<label [htmlFor]="" class="form-label">Heure de fin</label>
								<div class="input-icon-end position-relative">
									<p-datepicker
                                    name="end"
                                    ngModel
									inputId="calendar-timeonly"
									placeholder="Choisir"
									inputStyleClass="form-control timepicker w-100"
									[timeOnly]="true"
									[hourFormat]="'24'"
									/>
									<span class="input-icon-addon">
										<i class="ti ti-clock text-gray-7"></i>
									</span>
								</div>
							</div>
						</div>
					</div>
				</div>
                <app-modal-footer (cancel)="cancelAdd()" [disabled]="form.invalid ===true" [submitText]="'Ajouter'"></app-modal-footer>
				<!--<div class="modal-footer">
					<button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Annuler</button>
					<button type="submit" data-bs-dismiss="modal" [disabled]="form.invalid" class="btn btn-primary">Ajouter</button>
				</div>!-->
			</form>
		</div>
	</div>
</div>
