    <div class="border-bottom pb-2 mb-4">
              <h5 class="mb-2">Mes événements<span class="badge badge-success rounded-pill ms-2">{{myEvents.length}}</span></h5>
              @for (event of myEvents; track event.id) {
                <div class="border-start border-3 mb-3" [ngClass]="'border-' + event.color">
                  <div class="ps-3">
                    <h6 class="fw-medium mb-1">{{event.title}}</h6>
                    <p class="fs-12">
                      <i class="ti ti-calendar-check text-info me-2"></i>
                      {{event.date | date:'yyyy M dd'}}
                      @if (event.time) {
                        - {{event.time}}
                      }
                    </p>
                  </div>
                </div>
              }
              @if (myEvents.length === 0) {
                <p class="text-muted text-center py-2">Aucun événement personnel</p>
              }
            </div>
