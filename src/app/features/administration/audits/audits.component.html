<div class="page-wrapper">
  <div class="content">
    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
      <app-breadcrumbs></app-breadcrumbs>
      <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
        <div class="mb-2">
          <button (click)="exportData()" class="btn btn-outline-primary d-flex align-items-center me-2">
            <i class="ti ti-download me-2"></i>Export
          </button>
        </div>
      </div>
    </div>

    <!-- Main Card -->
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3">
        <h5>Registre des activités</h5>
        <div class="text-muted">
          <i class="ti ti-clock me-1"></i>
          Dernière mise à jour: {{ lastUpdate | date:'HH:mm' }}
        </div>
      </div>

      <!-- Filters -->
      <div class="card-body border-bottom">
        <div class="row g-3">
          <!-- Date Range -->
          <div class="col-md-3">
            <label class="form-label">Période</label>
            <input
              type="text"
              class="form-control date-range"
              bsDaterangepicker
              [(ngModel)]="dateRange"
              (ngModelChange)="applyFilters()"
              placeholder="dd/mm/yyyy - dd/mm/yyyy"
            />
          </div>

          <!-- Module -->
          <div class="col-md-2">
            <label class="form-label">Module</label>
            <select [(ngModel)]="moduleFilter" (ngModelChange)="applyFilters()" class="form-select">
              <option value="">Tous les modules</option>
              <option value="rh_intern">Rh Intern</option>
              <option value="rh_extern">Rh Externe</option>
              <option value="communication">Intranet</option>
            </select>
          </div>

          <!-- Role -->
          <div class="col-md-2">
            <label class="form-label">Role</label>
            <select [(ngModel)]="roleFilter" (ngModelChange)="applyFilters()" class="form-select">
              <option value="">Tous</option>
              <option value="ceo">CEO</option>
              <option value="rh">HR</option>
              <option value="manager">Manager</option>
              <option value="employee">Employee</option>
            </select>
          </div>

          <!-- Status -->
          <div class="col-md-2">
            <label class="form-label">Status</label>
            <select [(ngModel)]="statusFilter" (ngModelChange)="applyFilters()" class="form-select">
              <option value="">Tous les Status</option>
              <option value="success" class="text-success">Succès</option>
              <option value="error" class="text-danger">Erreur</option>
              <option value="warning" class="text-warning">Avertissement</option>
            </select>
          </div>

          <!-- Clear Filters -->
          <div class="col-md-1 d-flex align-items-end">
            <button (click)="clearFilters()" class="btn btn-outline-secondary w-100">
              <i class="ti ti-x"></i> Vider
            </button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card-body p-0">
        <div class="custom-datatable-filter">
          <div class="dataTables_wrapper dt-bootstrap5 no-footer">
            <!-- Search -->
            <div class="row mx-3 mt-3">
              <div class="col-sm-12 col-md-6">
                <div class="dataTables_length">
                  <label>
                    Montrer
                    <select [(ngModel)]="pageSize" (ngModelChange)="changePageSize(pageSize)" class="form-select form-select-sm">
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                    </select>
                    entrées
                  </label>
                </div>
              </div>
              <div class="col-sm-12 col-md-6">
                <div class="dataTables_filter">
                  <label>
                    <input
                      [(ngModel)]="searchText"
                      (ngModelChange)="applyFilters()"
                      type="search"
                      class="form-control form-control-sm"
                      placeholder="Search..."
                    />
                  </label>
                </div>
              </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <app-audit-list [tableData]="tableData" (onViewItem)="itemDetails($event)"></app-audit-list>
            </div>

            <!-- Pagination -->
            <app-custom-pagination
            
              (pageChanged)="changePage($event)"
            ></app-custom-pagination>
          </div>
        </div>
      </div>

      <!-- Footer Stats -->
       <app-footer-states [auditStates]="auditStates"></app-footer-states>
      
    </div>
  </div>
</div>
<!--===========================Details modal=====================================-->
<app-audit-details-modal (onCloseModal)="handlleCloseModal()" [showAuditDetailsModal]="showAuditDetailsModal" [data]="selectedItem"></app-audit-details-modal>
<!-- Backdrop effect si true we add this div to dom -->
@if(showAuditDetailsModal){
  <ng-container>
    <div (click)="handlleCloseModal()" (keyup)="handlleCloseModal()" tabindex="1" class="modal-backdrop fade show"></div>
  </ng-container>
 }
