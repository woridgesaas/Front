<div class="content">
  <!-- ================= HEADER ================= -->
  <div
    class="d-md-flex d-block align-items-center justify-content-between mb-4"
  >
    <app-breadcrumbs> </app-breadcrumbs>
    <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
      <div class="me-2 mb-2">
        <div class="dropdown">
          <a
            href="javascript:void(0);"
            class="dropdown-toggle btn btn-white d-inline-flex align-items-center"
            data-bs-toggle="dropdown"
          >
            <i class="ti ti-file-export me-1"></i>Exporter
          </a>
          <ul class="dropdown-menu dropdown-menu-end p-3">
            <li>
              <a href="javascript:void(0);" class="dropdown-item rounded-1">
                <i class="ti ti-file-type-pdf me-1"></i>Exporter en PDF
              </a>
            </li>
            <li>
              <a href="javascript:void(0);" class="dropdown-item rounded-1">
                <i class="ti ti-file-type-xls me-1"></i>Exporter en Excel
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= KPI ================= -->
  <app-leave-kpis [kpiData]="kpis"></app-leave-kpis>

  <!-- ================= CHART 1 ================= -->
  <app-leave-evolution-chart [leaveEvolutionChart]="leaveEvolutionChart"></app-leave-evolution-chart>

  <!-- ================= CHART 2 & 3 ================= -->
  <div class="row mb-4">
    <div class="col-xl-6">
        <app-leave-type-donut [leaveTypeDonutChart] = "leaveTypeDonutChart"></app-leave-type-donut>
    </div>
    
    <div class="col-xl-6">
        <app-leave-department-chart [leaveByDepartmentChart]="leaveByDepartmentChart"></app-leave-department-chart>
    </div>
  </div>

  <!-- ================= CHART 4 ================= -->
  <app-leave-acceptance-rate [leaveApprovalRateChart]="leaveApprovalRateChart"></app-leave-acceptance-rate>
</div>
