<div class="content">

    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between mb-3">
        <app-breadcrumbs></app-breadcrumbs>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <div class="me-2 mb-2">
                <div class="dropdown">
                    <a href="javascript:void(0);" class="dropdown-toggle btn btn-white d-inline-flex align-items-center" data-bs-toggle="dropdown">
                        <i class="ti ti-file-export me-1"></i>Exporter
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end p-3">
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-pdf me-1"></i>Exporter en PDF
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-xls me-1"></i>Exporter en Excel
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- /Breadcrumb -->

    <!-- ===== KPIS ========== -->
    <app-payslip-kpis [kpiData]="kpis"></app-payslip-kpis>
    <!-- ============ /KPIS ==============-->

    <!-- ========================= CHART 1 & 2 =============================== -->
    <div class="row">
        <!-- =======CHART 1 evolution====== -->
        <div class="col-xl-8">
            <app-payslip-evolution-chart [masseSalarialeChart]="masseSalarialeChart"></app-payslip-evolution-chart>
       </div>

        <!-- =======CHART 2 deduction======== -->
        <div class="col-xl-4">
            <app-payslip-deduction-donut [repartitionDeductionsChart]="repartitionDeductionsChart"></app-payslip-deduction-donut>
       </div>
    </div>

    <!-- Graphiques Section 2 -->
    <div class="row">
        <!-- ======= CHART 3 department ============ -->
        <div class="col-xl-6">
            <app-payslip-department-chart [comparaisonDepartementsChart]="comparaisonDepartementsChart"></app-payslip-department-chart>
        </div>

        <!-- ========== CHART 4 categories=============== -->
        <div class="col-xl-6">
            <app-payslip-category-chart [evolutionMensuelleChart]="evolutionMensuelleChart"></app-payslip-category-chart>
        </div>
    </div>
</div>
