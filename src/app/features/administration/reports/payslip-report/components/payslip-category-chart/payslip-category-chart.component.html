<div class="card flex-fill">
                <div class="card-header border-0 pb-0">
                    <div class="d-flex flex-wrap justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <span class="me-2"><i class="ti ti-chart-histogram text-warning"></i></span>

                        </div>
                        <div class="dropdown">

                            <ul class="dropdown-menu dropdown-menu-end p-2">
                                <li><a href="javascript:void(0);" class="dropdown-item rounded-1">3 Mois</a></li>

                </div>
                <div class="card-body">
                    <apx-chart

                        [xaxis]="evolutionMensuelleChart.xaxis"
