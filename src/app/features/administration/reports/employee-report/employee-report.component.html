<div class="content">

    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between mb-3">
        <app-breadcrumbs></app-breadcrumbs>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <div class="me-2 mb-2">
                <div class="dropdown">
                    <a href="javascript:void(0);" class="dropdown-toggle btn btn-white d-inline-flex align-items-center" data-bs-toggle="dropdown">
                        <i class="ti ti-file-export me-1"></i>Exporter
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end p-3">
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-pdf me-1"></i>Exporter en PDF
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-xls me-1"></i>Exporter en Excel
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- /Breadcrumb -->
    
    <!-- Haut kpis -->
     <app-employe-kpis [kpiData]="kpiData"></app-employe-kpis>
    <!-- /Haut Kpis -->

    <!--Employes evolution chart -->
    <app-employe-chart [evolutionEmployesChart] = "evolutionEmployesChart"></app-employe-chart>
     <!-- /Employes evolution chart -->

    <!-- depart distribution -->
    <app-depart-distribution-chart [totalEmployes]="statistiques.totalEmployes" [repartitionDepartementsChart]="repartitionDepartementsChart"></app-depart-distribution-chart>
    <!-- /depart distribution -->

</div>
