<div class="content">

  <!-- ================= HEADER ================= -->
  <div class="d-md-flex d-block align-items-center justify-content-between mb-4">
    <app-breadcrumbs
      title="Rapport de Présence"
      [breadcrumbItems]="breadCrumbItems">
    </app-breadcrumbs>
    <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <div class="me-2 mb-2">
                <div class="dropdown">
                    <a href="javascript:void(0);" class="dropdown-toggle btn btn-white d-inline-flex align-items-center" data-bs-toggle="dropdown">
                        <i class="ti ti-file-export me-1"></i>Exporter
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end p-3">
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-pdf me-1"></i>Exporter en PDF
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" class="dropdown-item rounded-1">
                                <i class="ti ti-file-type-xls me-1"></i>Exporter en Excel
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
  </div>

  <!-- ================= KPI ================= -->
  <div class="row g-3 mb-4">
    <div class="col-xl-3 col-md-6" *ngFor="let kpi of kpis">
      <div class="card kpi-card h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <p class="text-muted fs-13 mb-1">{{ kpi.label }}</p>
              <h3 class="fw-bold mb-0">{{ kpi.value }}</h3>
            </div>
            <div class="icon-circle" [ngClass]="kpi.color">
              <i [class]="kpi.icon"></i>
            </div>
          </div>

          <p class="fs-12 mb-0">
            <span [ngClass]="kpi.evolution >= 0 ? 'text-success' : 'text-danger'">
              {{ kpi.evolution }}%
            </span>
            vs mois dernier
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CHART 1 ================= -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="ti ti-chart-line me-2 text-primary"></i>
        Évolution de la présence
      </h5>
    </div>
    <div class="card-body">
      <apx-chart
        [series]="presenceEvolutionChart.series"
        [chart]="presenceEvolutionChart.chart"
        [stroke]="presenceEvolutionChart.stroke"
        [xaxis]="presenceEvolutionChart.xaxis"
        [tooltip]="presenceEvolutionChart.tooltip"
        [legend]="presenceEvolutionChart.legend"
        [colors]="presenceEvolutionChart.colors">
      </apx-chart>
    </div>
  </div>

  <!-- ================= CHART 2 & 3 ================= -->
  <div class="row mb-4">
    <div class="col-xl-6">
      <div class="card h-100">
        <div class="card-header">
          <h5 class="mb-0">
            <i class="ti ti-chart-pie me-2 text-success"></i>
            Répartition globale
          </h5>
        </div>
        <div class="card-body">
          <apx-chart
            [series]="presenceDonutChart.series"
            [chart]="presenceDonutChart.chart"
            [labels]="presenceDonutChart.labels"
            [colors]="presenceDonutChart.colors"
            [legend]="presenceDonutChart.legend">
          </apx-chart>
        </div>
      </div>
    </div>

    <div class="col-xl-6">
      <div class="card h-100">
        <div class="card-header">
          <h5 class="mb-0">
            <i class="ti ti-building me-2 text-warning"></i>
            Présence par département
          </h5>
        </div>
        <div class="card-body">
          <apx-chart
            [series]="presenceByDepartmentChart.series"
            [chart]="presenceByDepartmentChart.chart"
            [plotOptions]="presenceByDepartmentChart.plotOptions"
            [xaxis]="presenceByDepartmentChart.xaxis"
            [tooltip]="presenceByDepartmentChart.tooltip"
            [colors]="presenceByDepartmentChart.colors">
          </apx-chart>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CHART 4 ================= -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="ti ti-chart-area me-2 text-info"></i>
        Taux de présence mensuel (%)
      </h5>
    </div>
    <div class="card-body">
      <apx-chart
        [series]="presenceRateChart.series"
        [chart]="presenceRateChart.chart"
        [stroke]="presenceRateChart.stroke"
        [fill]="presenceRateChart.fill"
        [xaxis]="presenceRateChart.xaxis"
        [colors]="presenceRateChart.colors">
      </apx-chart>
    </div>
  </div>

</div>
