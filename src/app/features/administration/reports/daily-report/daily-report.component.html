<div class="content">
  <!-- ================= Breadcrumb ================= -->
  <div
    class="d-md-flex d-block align-items-center justify-content-between mb-3"
  >
    <app-breadcrumbs> </app-breadcrumbs>

    <div class="d-flex align-items-center">
      <div class="dropdown me-2">
        <a
          class="btn btn-white dropdown-toggle d-inline-flex align-items-center"
          href="javascript:void(0)"
          data-bs-toggle="dropdown"
        >
          <i class="ti ti-file-export me-1"></i> Exporter
        </a>
        <ul class="dropdown-menu dropdown-menu-end p-2">
          <li>
            <a class="dropdown-item rounded-1">
              <i class="ti ti-file-type-pdf me-1"></i> PDF
            </a>
          </li>
          <li>
            <a class="dropdown-item rounded-1">
              <i class="ti ti-file-type-xls me-1"></i> Excel
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- ================= KPI + LINE CHART ================= -->
  <div class="row g-3 mb-4">
    <!-- ===== LEFT : KPI ===== -->
    <div class="col-xl-4">
      <div class="row g-3">
        <!-- Total présents -->
        <div class="col-12">
          <div class="card">
            <div
              class="card-body d-flex justify-content-between align-items-center"
            >
              <div>
                <p class="fs-12 mb-1">Total des présents</p>
                <h4 class="mb-0">300/315</h4>
              </div>
              <span
                class="p-2 rounded-circle border border-primary bg-transparent-primary"
              >
                <i class="ti ti-user-check text-primary"></i>
              </span>
            </div>
          </div>
        </div>

        <!-- Total absents (SOUS présents) -->
        <div class="col-12">
          <div class="card">
            <div
              class="card-body d-flex justify-content-between align-items-center"
            >
              <div>
                <p class="fs-12 mb-1">Total des absents</p>
                <h4 class="mb-0">15</h4>
              </div>
              <span
                class="p-2 rounded-circle border border-danger bg-transparent-danger"
              >
                <i class="ti ti-user-x text-danger"></i>
              </span>
            </div>
          </div>
        </div>
        <!-- Taux de présence -->
        <div class="col-12">
          <div class="card">
            <div
              class="card-body d-flex justify-content-between align-items-center"
            >
              <div>
                <p class="fs-12 mb-1">Taux de présence</p>
                <h4 class="mb-0 text-success">95%</h4>
              </div>
              <span class="rounded-circle bg-transparent-success">
                <i class="ti ti-chart-pie text-success"></i>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== RIGHT : LINE CHART ===== -->
    <!-- ===== RIGHT : LINE CHART ===== -->
    <div class="col-xl-8">
      <div class="card h-100">
        <div
          class="card-header border-0 pb-0 d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0">
            <i class="ti ti-chart-line me-2 text-danger"></i>
            Présence quotidienne
          </h5>

          <div class="dropdown">
            <a
              class="btn btn-sm btn-white dropdown-toggle fs-12"
              href="javascript:void(0)"
              data-bs-toggle="dropdown"
            >
              Cette année
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item">2024</a></li>
              <li><a class="dropdown-item">2023</a></li>
              <li><a class="dropdown-item">2022</a></li>
            </ul>
          </div>
        </div>

        <div class="card-body pt-2" style="min-height: 360px">
          <apx-chart
            *ngIf="daily_chart"
            [series]="daily_chart.series"
            [chart]="daily_chart.chart"
            [colors]="daily_chart.colors"
            [stroke]="daily_chart.stroke"
            [xaxis]="daily_chart.xaxis"
            [yaxis]="daily_chart.yaxis"
            [dataLabels]="daily_chart.dataLabels"
            [grid]="daily_chart.grid"
            [legend]="daily_chart.legend"
            [tooltip]="daily_chart.tooltip"
            [plotOptions]="daily_chart.plotOptions"
          >
          </apx-chart>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <!-- ================= Donut : Présents vs Absents ================= -->
    <div class="col-xl-4">
      <div class="card h-100">
        <div
          class="card-header border-0 pb-0 d-flex align-items-center justify-content-between"
        >
          <h6 class="mb-0 d-flex align-items-center">
            <i class="ti ti-chart-pie me-2 text-primary"></i>
            Répartition globale
            <span
              class="ms-2 text-muted"
              data-bs-toggle="tooltip"
              title="Vue d’ensemble de la répartition entre les employés présents et absents"
            >
              <i class="ti ti-info-circle fs-14"></i>
            </span>
          </h6>
        </div>

        <div class="card-body d-flex align-items-center justify-content-center">
          <apx-chart
            [series]="presenceDonut.series"
            [chart]="presenceDonut.chart"
            [labels]="presenceDonut.labels"
            [colors]="presenceDonut.colors"
            [legend]="presenceDonut.legend"
          >
          </apx-chart>
        </div>
      </div>
    </div>

    <!-- ================= Bar : Présence par département ================= -->
    <div class="col-xl-8">
      <div class="card h-100">
        <div
          class="card-header border-0 pb-0 d-flex align-items-center justify-content-between"
        >
          <h6 class="mb-0 d-flex align-items-center">
            <i class="ti ti-building-community me-2 text-success"></i>
            Présence par département
            <span
              class="ms-2 text-muted"
              data-bs-toggle="tooltip"
              title="Comparaison du nombre d’employés présents par département"
            >
              <i class="ti ti-info-circle fs-14"></i>
            </span>
          </h6>
        </div>

        <div class="card-body">
          <apx-chart
            [series]="deptPresence.series"
            [chart]="deptPresence.chart"
            [xaxis]="deptPresence.xaxis"
            [colors]="deptPresence.colors"
            [plotOptions]="deptPresence.plotOptions"
          >
          </apx-chart>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 mt-3">
    <!-- Histogramme : Absences par type -->
    <div class="col-xl-12">
      <div class="card h-100">
        <div
          class="card-header border-0 pb-0 d-flex align-items-center justify-content-between"
        >
          <h6 class="mb-0 d-flex align-items-center">
            <i class="ti ti-alert-triangle me-2 text-danger"></i>
            Absences par type
            <span
              class="ms-2 text-muted"
              data-bs-toggle="tooltip"
              title="Répartition des absences selon leur type (maladie, congé, exceptionnel, etc.)"
            >
              <i class="ti ti-info-circle fs-14"></i>
            </span>
          </h6>
        </div>

        <div class="card-body">
          <small class="text-muted">
            Répartition des absences selon leur nature sur la journée
          </small>

          <apx-chart
            [series]="absenceTypeHorizontalChart.series"
            [chart]="absenceTypeHorizontalChart.chart"
            [xaxis]="absenceTypeHorizontalChart.xaxis"
            [yaxis]="absenceTypeHorizontalChart.yaxis"
            [colors]="absenceTypeHorizontalChart.colors"
            [plotOptions]="absenceTypeHorizontalChart.plotOptions"
            [dataLabels]="absenceTypeHorizontalChart.dataLabels"
            [grid]="absenceTypeHorizontalChart.grid"
          >
          </apx-chart>
        </div>
      </div>
    </div>
  </div>
</div>
