<div class="content">
  <!-- ================= Breadcrumb ================= -->
  <div
    class="d-md-flex d-block align-items-center justify-content-between mb-3"
  >
    <app-breadcrumbs> </app-breadcrumbs>

    <div class="d-flex align-items-center">
      <div class="dropdown me-2">
        <a
          class="btn btn-white dropdown-toggle d-inline-flex align-items-center"
          href="javascript:void(0)"
          data-bs-toggle="dropdown"
        >
          <i class="ti ti-file-export me-1"></i> Exporter
        </a>
        <ul class="dropdown-menu dropdown-menu-end p-2">
          <li>
            <a class="dropdown-item rounded-1">
              <i class="ti ti-file-type-pdf me-1"></i> PDF
            </a>
          </li>
          <li>
            <a class="dropdown-item rounded-1">
              <i class="ti ti-file-type-xls me-1"></i> Excel
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- ================= KPIs================= -->
   <app-daily-kpis [kpiData]="kpiData"></app-daily-kpis>

   <!-- ======================  CHART 1 Global daily metrics ================-->
  <app-daily-metrics-chart [daily_chart]="daily_chart"></app-daily-metrics-chart>
  <div class="row g-3">
    <!-- ================= CHART 2  DONUT  presence vs absense ================= -->
    <div class="col-xl-4">
      <app-daily-presence-donut [presenceDonut]="presenceDonut"></app-daily-presence-donut>
    </div>
    <!-- ================= CHART 3 presence by depart ================= -->
    <div class="col-xl-8">
      <app-daily-presence-department-chart [deptPresence]="deptPresence"></app-daily-presence-department-chart>
    </div>
  </div>
  <!-- ================= CHART 4 absence by type ================= -->
  <app-daily-absence-type-chart [absenceType]="absenceType"></app-daily-absence-type-chart>
</div>
