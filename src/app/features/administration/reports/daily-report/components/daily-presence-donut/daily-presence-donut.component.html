 <div class="card h-100">
        <div
          class="card-header border-0 pb-0 d-flex align-items-center justify-content-between"
        >
          <h6 class="mb-0 d-flex align-items-center">
            <i class="ti ti-chart-pie me-2 text-primary"></i>
            Répartition globale
            <span
              class="ms-2 text-muted"
              data-bs-toggle="tooltip"
              title="Vue d’ensemble de la répartition entre les employés présents et absents"
            >
              <i class="ti ti-info-circle fs-14"></i>
            </span>
          </h6>
        </div>

        <div class="card-body d-flex align-items-center justify-content-center">
          <apx-chart
            [series]="presenceDonut.series"
            [chart]="presenceDonut.chart"
            [labels]="presenceDonut.labels"
            [colors]="presenceDonut.colors"
            [legend]="presenceDonut.legend"
          >
          </apx-chart>
        </div>
      </div>
