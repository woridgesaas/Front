<div class="me-1">
  <a
    [routerLink]="routes.chat"
    class="btn btn-menubar position-relative"
  >
    <i class="ti ti-brand-hipchat"></i>

    @if (unreadCount > 0) {
      <span
        class="badge bg-info rounded-pill d-flex align-items-center justify-content-center header-badge"
      >
        {{ unreadCount }}
      </span>
    }
  </a>
</div>
