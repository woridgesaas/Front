<!--* Onboarding card (Logo + title + description + custom content)-->
<app-onboarding-card [title]="title" [description]="description">

  <!--* Action button -->
  <button class="btn btn-primary btn-lg w-100" data-bs-toggle="modal" data-bs-target="#ceoModal">
    <i [class]="buttonIcon" class="me-1"></i> {{ buttonText }}
  </button>

</app-onboarding-card>

<!--* User setup modal -->
<app-user-setup-modal [role]="role" [title]="title" [icon]="buttonIcon" (saved)="onSaved()"></app-user-setup-modal>
