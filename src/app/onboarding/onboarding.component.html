<div class="container py-5">

  <!--* Step 01 : CEO -->
  <app-user-setup
    *ngIf="currentStep === 1"
    [role]="Role.CEO"
    title="Création du compte administrateur (CEO)"
    description="Cette étape permet de créer le compte administrateur principal (CEO). Ce compte dispose de tous les droits pour configurer la plateforme, gérer les paramètres globaux et administrer les utilisateurs."
    buttonText="Créer le compte CEO"
    buttonIcon="fa-solid fa-user-gear"
    (completed)="onCeoCompleted()">
  </app-user-setup>

  <!--* Step 02 : Settings -->
  <app-app-settings-setup
    *ngIf="currentStep === 2"
    (completed)="nextStep()"
    (skipped)="nextStep()">
  </app-app-settings-setup>

</div>
