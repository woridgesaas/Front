<div class="modal fade" id="ceoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0">

      <!--* Modal header (title + icon +close button) -->
      <app-modal-header [title]="title" [icon]="icon" (close)="onClose()"></app-modal-header>


      <!--* Form -->
      <form (ngSubmit)="submit()">
        <div class="modal-body">
          <div class="d-flex align-items-center bg-light rounded p-3 mb-4">
            <div class="avatar avatar-xxl rounded-circle border border-dashed d-flex align-items-center justify-content-center me-3">
              <img *ngIf="preview" [src]="preview" class="rounded-circle object-fit-cover" width="96" height="96"/>
              <i *ngIf="!preview" class="ti ti-photo fs-3 text-muted"></i>
            </div>

            <!--* Profil image -->
            <div>
              <h6 class="mb-1"> Photo de profil </h6>
              <p class="text-muted fs-12 mb-2"> Image inférieure à 4 MB (JPG, PNG) </p>

              <label class="btn btn-sm btn-primary mb-0">
                Parcourir <input type="file" class="d-none" accept=".jpg,.jpeg,.png" (change)="onFileChange($event)"/>
              </label>
            </div>
          </div>

          <!--* Personal information -->
          <div class="row g-3">

            <!--* First name-->
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Prénom" [(ngModel)]="form.firstName" name="firstName" (blur)="touched = true"/>
            </div>

            <!--* Last name -->
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="form.lastName" name="lastName" (blur)="touched = true"/>
            </div>

            <!--* Email -->
            <div class="col-md-6">
              <input type="email" class="form-control" placeholder="Adresse email" [(ngModel)]="form.email" name="email" (blur)="touched = true"/>
            </div>

            <!--* Phone number -->
            <div class="col-md-6">
              <input type="tel" class="form-control" placeholder="Téléphone" [(ngModel)]="form.phone" name="phone" (blur)="touched = true"/>
            </div>


            <!--* Error message -->
            <div class="col-12">
              <app-form-error-message [show]="touched && isInvalid" [message]="getErrorMessage()"></app-form-error-message>
            </div>
          </div>
        </div>

        <!--* Modal footer (submit + cancel button) -->
        <app-modal-footer submitText="Continuer" submitIcon="fa-solid fa-arrow-right" [disabled]="isInvalid" (cancel)="onClose()"></app-modal-footer>

      </form>
    </div>
  </div>
</div>
