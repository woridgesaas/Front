<!--* Onboarding card (Logo + title + description + custom content)-->
<app-onboarding-card [title]="title" [description]="description">
  <button class="btn btn-primary btn-lg w-100" (click)="openModal()">
    <i [class]="buttonIcon" class="me-1"></i>
    {{ buttonText }}
  </button>
</app-onboarding-card>
