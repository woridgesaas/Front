<div class="row justify-content-center bg-white">
    <div class="col-md-5">

    <!--* Lock screen form -->
      <form>
        <div class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0">

        <!--* Logo -->
         <app-logo></app-logo>

          <div class="card rounded-4 bg-primary-transparent">
            <div class="card-body p-4">

            <!--* Avatar + Name -->
              <div class="mb-4 text-center">
                <h2 class="mb-2"> Heureux de vous revoir ! </h2>
                <img src="assets/img/profiles/avatar-12.jpg" alt="Avatar image" class="img-fluid avatar avatar-xxl rounded-pill my-3"/>
                <h6 class="text-dark"> Adrian Davies </h6>
              </div>

             <!--* Password input -->
              <div class="mb-3">
                <div class="pass-group">
                  <input [type]="password[0] ? 'text' : 'password'" class="pass-input form-control rounded-4" placeholder="Entrer votre mot de passe"/>
                  <span class="ti toggle-password" [ngClass]="password[0] ? 'ti-eye' : 'ti-eye-off'" (click)="togglePassword(0)" (keydown.enter)="togglePassword(0)" tabindex="0"></span>
                </div>
              </div>

             <!--* Log in button -->
             <!--! If password are valid, redirect to the index page -->
              <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100 rounded-4">
                      <i class="fa fa-sign-in-alt me-2"></i>
                      <span> Se connecter </span>
                    </button>
              </div>

            </div>

          </div>

            <!--* Footer -->
          <app-footer></app-footer>

        </div>
      </form>

    </div>
</div>
