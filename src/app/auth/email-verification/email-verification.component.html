<div class="container-fluid">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">

      <!--* Backgroun image -->
      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration backgroundImage="assets/img/bg/email_verification.png"></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap">
          <div class="col-md-7 mx-auto p-4">
            <div class="digit-group">

              <!--* Logo -->
              <app-logo></app-logo>

              <!--* Description -->
              <app-description title="Vérification par e-mail" [text]="'Veuillez entrer le code de confirmation envoyé à ' + maskedEmail"></app-description>

              <div class="text-center otp-input">

                <!--* 6 digit input -->
                <div class="d-flex align-items-center justify-content-center mb-3 gap-2">
                  <input
                    *ngFor="let i of indices"
                    #otpInput
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    class="otp-digit rounded py-sm-3 py-2 text-center fs-26 fw-bold"
                    [value]="otpValues[i]"
                    (keydown)="onKeydown($event, i)"
                    (input)="onInput($event, i)"
                    (paste)="onPaste($event)"
                    [disabled]="isExpired || isLoading"
                    autocomplete="off"
                  />
                </div>

                <!--* Timer display -->
                <div class="badge mb-3" [class.bg-medium-purple]="!isExpired" [class.bg-danger]="isExpired">
                  <p class="d-flex align-items-center mb-0">
                    <i class="fa fa-clock me-1"></i>
                    {{ isExpired ? "Code expiré" : timerDisplay }}
                  </p>
                </div>

                <!--* Resend code -->
                <div class="mb-3 d-flex justify-content-center">
                  <p class="text-gray-9 mb-0">
                    Tu n'as pas reçu le code ?
                    <a
                      href="javascript:void(0);"
                      class="text-primary hover-a"
                      [class.opacity-50]="isResending"
                      (click)="onResendCode()"
                    >
                      {{isResending ? "Envoi en cours..." : "Renvoyer le code"}}
                    </a>
                  </p>
                </div>
              </div>

              <!--* Submit button -->
              <div class="mb-3">
                <button type="button" class="btn btn-primary w-100 rounded-4" [disabled]="!isOtpComplete() || isLoading || isExpired" (click)="onSubmit()">
                  <span *ngIf="!isLoading">
                    <i class="fa fa-check-circle me-2"></i>Vérifier
                  </span>
                  <span *ngIf="isLoading">
                    <i class="fa fa-spinner fa-spin me-2"></i>Vérification...
                  </span>
                </button>
              </div>
            </div>

            <!--* Footer -->
            <app-footer></app-footer>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
