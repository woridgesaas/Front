<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">
      <!--* Backgroun image -->
      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration
          backgroundImage="assets/img/bg/login.png"
        ></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div
          class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap"
        >
          <div class="col-md-7 mx-auto vh-100">
            <!--* Log in form -->
            <form
              class="vh-100"
              #loginForm="ngForm"
              (ngSubmit)="onSubmit(loginForm)"
            >
              <div
                class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0"
              >
                <!--* Logo -->
                <app-logo></app-logo>

                <div class="">
                  <app-description
                    title="Se connecter"
                    text="Veuillez entrer vos coordonnées pour vous connecter"
                  ></app-description>

                  <!--* EMAIL input -->
                  <div class="mb-3">
                    <div class="input-group">
                      <input
                        type="email"
                        class="form-control border-end-0 rounded-start-4"
                        placeholder="Entrer votre adresse email"
                        [(ngModel)]="email"
                        name="email"
                        #emailCtrl="ngModel"
                        required
                        minlength="5"
                        maxlength="100"
                        email
                        [ngClass]="{
                          'is-invalid': emailCtrl.invalid && emailCtrl.touched,
                          'is-valid': emailCtrl.valid && emailCtrl.touched
                        }"
                      />

                      <span
                        class="input-group-text border-start-0 rounded-end-4"
                      >
                        <i class="fa-solid fa-envelope"></i>
                      </span>
                    </div>

                    <div
                      class="invalid-feedback d-block"
                      *ngIf="emailCtrl.invalid && emailCtrl.touched"
                    >
                      {{
                        validationService.getErrorMessage(
                          emailCtrl.control,
                          "Email"
                        )
                      }}
                    </div>
                  </div>

                  <!--* Password input-->
                  <div class="mb-3">
                    <div class="pass-group">
                      <input
                        [type]="password[0] ? 'text' : 'password'"
                        class="pass-input form-control rounded-4"
                        placeholder="Entrer votre mot de passe"
                        [(ngModel)]="userPassword"
                        name="password"
                        #passwordCtrl="ngModel"
                        required
                        minlength="8"
                        maxlength="128"
                        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).+$"
                        [ngClass]="{
                          'is-invalid':
                            passwordCtrl.invalid && passwordCtrl.touched,
                          'is-valid': passwordCtrl.valid && passwordCtrl.touched
                        }"
                      />

                      <span
                        class="ti toggle-password"
                        [ngClass]="password[0] ? 'ti-eye' : 'ti-eye-off'"
                        (click)="togglePassword(0)"
                        tabindex="0"
                      ></span>
                    </div>

                    <div
                      class="invalid-feedback d-block"
                      *ngIf="passwordCtrl.invalid && passwordCtrl.touched"
                    >
                      {{
                        validationService.getErrorMessage(
                          passwordCtrl.control,
                          "Mot de passe"
                        )
                      }}
                    </div>
                  </div>

                  <div
                    class="d-flex align-items-center justify-content-between mb-3"
                  >
                    <!--* Remember me input -->
                    <div class="d-flex align-items-center">
                      <div class="form-check form-check-md mb-0">
                        <input
                          class="form-check-input"
                          id="remember_me"
                          type="checkbox"
                        />
                        <label for="remember_me" class="form-check-label mt-0"
                          >Se souvenir de moi</label
                        >
                      </div>
                    </div>

                    <!--* Forget password link-->
                    <div class="text-end">
                      <a [routerLink]="routes.forgotPassword" class="hover-a"
                        >Mot de passe oublié ?</a
                      >
                    </div>
                  </div>

                  <!--* Log in button -->
                  <!--! If credentials are valid, redirect to the index page -->
                  <div class="mb-3">
                    <button
                      type="submit"
                      class="btn btn-primary w-100 rounded-4"
                      [disabled]="loginForm.invalid"
                    >
                      <i class="fa fa-sign-in-alt me-2"></i>
                      <span> Se connecter </span>
                    </button>
                  </div>
                </div>

                <!--* Footer -->
                <app-footer></app-footer>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
