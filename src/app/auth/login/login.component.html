<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">

      <!--* Background image -->
      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration backgroundImage="assets/img/bg/login.png"></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap">
          <div class="col-md-7 mx-auto vh-100">

            <div class="vh-100">
              <div class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0">

                <!--* Logo -->
                <app-logo></app-logo>

                <div>
                  <app-description
                    title="Se connecter"
                    text="Veuillez entrer vos coordonnées pour vous connecter"
                  ></app-description>

                  <!--* EMAIL -->
                  <div class="mb-3">
                    <div class="input-group">
                      <input
                        type="email"
                        class="form-control border-end-0 rounded-start-4"
                        placeholder="Entrer votre adresse email"
                        [(ngModel)]="email"
                        name="email"
                      />
                      <span class="input-group-text border-start-0 rounded-end-4">
                        <i class="fa-solid fa-envelope"></i>
                      </span>
                    </div>
                  </div>

                  <!--* PASSWORD -->
                  <div class="mb-3">
                    <div class="pass-group">
                      <input
                        [type]="password[0] ? 'text' : 'password'"
                        class="pass-input form-control rounded-4"
                        placeholder="Entrer votre mot de passe"
                        [(ngModel)]="userPassword"
                        name="password"
                      />
                      <span
                        class="ti toggle-password"
                        [ngClass]="password[0] ? 'ti-eye' : 'ti-eye-off'"
                        (click)="togglePassword(0)"
                        tabindex="0"
                      ></span>
                    </div>
                  </div>

                  <div class="d-flex align-items-center justify-content-between mb-3">
                    <!--* Remember me -->
                    <div class="d-flex align-items-center">
                      <div class="form-check form-check-md mb-0">
                        <input class="form-check-input" id="remember_me" type="checkbox" />
                        <label for="remember_me" class="form-check-label mt-0">
                          Se souvenir de moi
                        </label>
                      </div>
                    </div>

                    <!--* Forgot password -->
                    <div class="text-end">
                      <a [routerLink]="routes.forgotPassword" class="hover-a">
                        Mot de passe oublié ?
                      </a>
                    </div>
                  </div>

                  <!--* Bouton Login -->
                  <div class="mb-3">
                    <button
                      type="button"
                      class="btn btn-primary w-100 rounded-4"
                      [disabled]="isLoading"
                      (click)="onSubmit()"
                    >
                      <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                      <i *ngIf="!isLoading" class="fa fa-sign-in-alt me-2"></i>
                      <span>{{ isLoading ? 'Connexion...' : 'Se connecter' }}</span>
                    </button>
                  </div>
                </div>

                <!--* Footer -->
                <app-footer></app-footer>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
