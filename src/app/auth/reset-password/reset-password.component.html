<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">

      <!--* Background image -->
      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration backgroundImage="assets/img/bg/reset_password.png"></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap">
          <div class="col-md-7 mx-auto vh-100">

            <!--* Reset password form -->
            <form class="vh-100" (ngSubmit)="onSubmit()">
              <div class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0">

                <!--* Logo -->
                <app-logo></app-logo>

                <!--* Description -->
                <app-description title="Réinitialiser votre mot de passe" text="Veuillez choisir un mot de passe différent de vos anciens mots de passe."></app-description>

                <!--* New password -->
                <div class="pass-group mb-3">
                  <input
                    name="newPassword"
                    [(ngModel)]="newPassword"
                    [type]="password[0] ? 'text' : 'password'"
                    placeholder="Entrer le nouveau mot de passe"
                    class="form-control rounded-4"
                    (input)="checkPasswordStrength($event)"
                    required
                  />

                  <span class="ti toggle-password" [ngClass]="password[0] ? 'ti-eye' : 'ti-eye-off'" (click)="togglePassword(0)"></span>
                </div>

                <!--* Strength bar -->
                <div
                  class="strength-meter mb-2"
                  [ngClass]="{
                    'poor-active': strengthLevel === 'poor',
                    'avg-active': strengthLevel === 'weak',
                    'heavy-active': strengthLevel === 'heavy'
                  }"
                >
                  <span [class.active]="strengthLevel === 'poor' || strengthLevel === 'weak' || strengthLevel === 'heavy'"></span>

                  <span [class.active]="strengthLevel === 'weak' || strengthLevel === 'heavy'"></span>

                  <span [class.active]="strengthLevel === 'heavy'"></span>

                  <span [class.active]="strengthLevel === 'heavy'"></span>
                </div>

                <!--* Message -->
                <p class="text-center fs-12" [style.color]="passwordInfoColor">
                  {{ passwordInfoMessage || "8+ caractères avec majuscule, minuscule, chiffre et symbole" }}
                </p>

                <!--* Confirm password -->
                <div class="pass-group mb-3">
                  <input
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    [type]="password[1] ? 'text' : 'password'"
                    placeholder="Confirmer le mot de passe"
                    class="form-control rounded-4"
                    required
                  />

                  <span class="ti toggle-password" [ngClass]="password[1] ? 'ti-eye' : 'ti-eye-off'" (click)="togglePassword(1)"></span>
                </div>

                <!--* Submit button -->
                <button
                  type="submit"
                  class="btn btn-primary w-100 rounded-4"
                  [disabled]="isLoading || strengthLevel !== 'heavy'"
                >
                  <span *ngIf="!isLoading">Envoyer</span>
                  <span *ngIf="isLoading">Chargement...</span>
                </button>

                <!--* Footer -->
                <app-footer></app-footer>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
