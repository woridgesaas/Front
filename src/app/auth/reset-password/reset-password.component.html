<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">
      <!--* Backgroun image -->
      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration
          backgroundImage="assets/img/bg/reset_password.png"
        ></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div
          class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap"
        >
          <div class="col-md-7 mx-auto vh-100">
            <!--* Reset password form -->
            <form class="vh-100">
              <div
                class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0"
              >
                <!--* Logo -->
                <app-logo></app-logo>

                <div class="">
                  <app-description
                    title="Réinitialiser votre mot de passe"
                    text="Veuillez choisir un mot de passe différent de vos anciens
                      mots de passe."
                  ></app-description>
                  <div>
                    <div class="input-block mb-3">
                      <div class="mb-3">
                        <div id="passwordInput" class="form-group">
                          <!--* New password input -->
                          <div class="pass-group mb-3">
                            <input
                              [type]="password[0] ? 'text' : 'password'"
                              placeholder="Entrer le nouveau mot de passe"
                              id="password"
                              class="pass-input form-control rounded-4"
                              (input)="checkPasswordStrength($event)"
                            />
                            <span
                              class="ti toggle-password"
                              [ngClass]="password[0] ? 'ti-eye' : 'ti-eye-off'"
                              (click)="togglePassword(0)"
                              (keydown.enter)="togglePassword(0)"
                              tabindex="0"
                            ></span>
                          </div>

                          <!--* Password strength -->
                          <div
                            id="passwordStrength"
                            class="strength-meter"
                            [ngClass]="{
                              'poor-active': strengthLevel === 'poor',
                              'avg-active': strengthLevel === 'weak',
                              'strong-active': strengthLevel === 'strong',
                              'heavy-active': strengthLevel === 'heavy'
                            }"
                          >
                            <span
                              id="poor"
                              [ngClass]="{
                                active:
                                  strengthLevel === 'poor' ||
                                  strengthLevel === 'weak' ||
                                  strengthLevel === 'strong' ||
                                  strengthLevel === 'heavy'
                              }"
                            ></span>
                            <span
                              id="weak"
                              [ngClass]="{
                                active:
                                  strengthLevel === 'weak' ||
                                  strengthLevel === 'strong' ||
                                  strengthLevel === 'heavy'
                              }"
                            ></span>
                            <span
                              id="strong"
                              [ngClass]="{
                                active:
                                  strengthLevel === 'strong' ||
                                  strengthLevel === 'heavy'
                              }"
                            ></span>
                            <span
                              id="heavy"
                              [ngClass]="{ active: strengthLevel === 'heavy' }"
                            ></span>
                          </div>
                        </div>
                      </div>

                      <p id="passwordInfo" class="fs-12 text-center">
                        Utilisez 8 caractères ou plus avec un mélange de
                        lettres, chiffres et symboles.
                      </p>
                    </div>

                    <!--* Confirm password input -->
                    <div class="mb-3">
                      <div class="pass-group">
                        <input
                          [type]="password[1] ? 'text' : 'password'"
                          placeholder="Confirmer le nouveau mot de passe"
                          id="password"
                          class="pass-input form-control rounded-4"
                        />
                        <span
                          class="ti toggle-password"
                          [ngClass]="password[1] ? 'ti-eye' : 'ti-eye-off'"
                          (click)="togglePassword(1)"
                          (keydown.enter)="togglePassword(1)"
                          tabindex="0"
                        ></span>
                      </div>
                    </div>

                    <!--* Verify button -->
                    <!--! If the password and confirm password is correct, redirect to success page-->
                    <div class="mb-3">
                      <button
                        type="submit"
                        class="btn btn-primary w-100 rounded-4"
                      >
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        <span> Envoyer </span>
                      </button>
                    </div>
                  </div>
                </div>

                <!--* Footer -->
                <app-footer></app-footer>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
