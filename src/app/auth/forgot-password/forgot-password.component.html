<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">
      <!--* Backgroung image -->

      <div class="col-lg-5 d-none d-lg-block p-0 bg-primary-transparent">
        <app-illustration backgroundImage="assets/img/bg/forgot_password.png"></app-illustration>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap">
          <div class="col-md-7 mx-auto vh-100">

            <!--* forgot password form -->
            <form class="vh-100" (ngSubmit)="onSubmit()">
              <div class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0">

                <!--* Logo -->
                <app-logo></app-logo>

                  <div class="">

                    <!--* Description -->
                    <app-description title="Mot de passe oublié ?" text="Nous vous enverrons un e-mail contenant les étapes pour le réinitialiser."></app-description>

                    <div class="mb-3">
                      <div class="input-group">
                        <input
                          type="email"
                          [(ngModel)]="email"
                          name="email"
                          class="form-control border-end-0 rounded-start-4"
                          placeholder="Entrer votre adresse email"
                          required
                          pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"
                        />
                        <span class="input-group-text border-start-0 rounded-end-4">
                          <i class="ti ti-mail"></i>
                        </span>
                      </div>
                    </div>

                    <div class="mb-3">
                      <button type="submit" class="btn btn-primary w-100 rounded-4" [disabled]="isLoading">
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        <span>{{ isLoading ? 'Envoi en cours...' : 'Envoyer' }}</span>
                      </button>
                    </div>

                    <div class="text-center">
                      <h6 class="fw-normal text-dark mb-0">
                        Revenir pour
                        <a [routerLink]="routes.login" class="hover-a">vous connecter</a>
                      </h6>
                    </div>
                  </div>

                  <!--* Footer *-->
                  <app-footer></app-footer>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
