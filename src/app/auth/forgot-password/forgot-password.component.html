<div class="container-fuild">
  <div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">
    <div class="row">

      <!--* Backgroung image -->
      <div class="col-lg-5">
        <div class="d-lg-flex align-items-center justify-content-center d-none flex-wrap vh-100 bg-primary-transparent">
          <div>
            <img src="assets/img/bg/forgot_password.png" alt="Background image"/>
          </div>
        </div>
      </div>

      <div class="col-lg-7 col-md-12 col-sm-12">
        <div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap">
          <div class="col-md-7 mx-auto vh-100">

            <!--* forgot password form -->
            <form class="vh-100">
              <div class="min-vh-100 d-flex flex-column justify-content-center p-3 p-md-5 pb-0">

                <!--* Logo -->
                 <div class=" mx-auto mb-5 text-center">
                    <img src="assets/favicon_io/logo1.ico" class="img-fluid w-50" alt="Logo">
                </div>

                <div class="">
                  <div class="text-center mb-3">
                    <h2 class="mb-2"> Mot de passe oublié ? </h2>
                    <p class="mb-0"> Mot de passe oublié ? Nous vous enverrons un e-mail contenant les étapes pour le réinitialiser. </p>
                  </div>

                  <!--* Email address -->
                  <div class="mb-3">
                    <div class="input-group">
                      <input type="email" value="" class="form-control border-end-0 rounded-start-4" placeholder="Entrer votre adresse email"/>
                      <span class="input-group-text border-start-0 rounded-end-4">
                        <i class="ti ti-mail"></i>
                      </span>
                    </div>
                  </div>

                  <!--* Submit button -->
                  <!--! If email are valid, send code then redirect to email verification page -->
                  <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100 rounded-4"> 
                      <i class="fa-solid fa-paper-plane me-2"></i>
                      <span> Envoyer </span>
                    </button>
                  </div>

                  <!--* Log in link-->
                  <div class="text-center">
                    <h6 class="fw-normal text-dark mb-0"> Revenir pour 
                        <a [routerLink]="routes.login" class="hover-a">vous connecter</a>
                    </h6>
                  </div>

                </div>

                <!--* Footer-->
                <div class="mt-5 pb-4 text-center">
                  <p class="mb-0 text-gray-9"> Copyright &copy; 2025 Woridge. Tous droits réservés. </p>
                </div>

              </div>

            </form>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
