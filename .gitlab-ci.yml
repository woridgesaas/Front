image: docker:24.0.5
services:
  - docker:24.0.5-dind

stages:
  - build
  - push
  - test

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

#Execute for code source not image
#test-job:

build-job:
  stage: build
  script:
    - echo "NG_APP_TINYMCE_API_KEY=$NG_APP_TINYMCE_API_KEY" > .env
    - docker build -t $IMAGE_NAME -f infra/Dockerfile .
#push image just in case MR  OR push directly into main
push-job:
  stage: push
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME
    - echo "Pushing $IMAGE_NAME in $CI_COMMIT_BRANCH branch"
  only:
    - main
