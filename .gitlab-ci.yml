image: node:20

stages:
  - build
  - test

cache:
  paths:
    - node_modules/

before_script:
  - npm install

build-job:
  stage: build
  script:
    - echo "Running Angular build... in branch $CI_COMMIT_BRANCH"
    - echo "NG_APP_TINYMCE_API_KEY=$NG_APP_TINYMCE_API_KEY" > .env #inject the variable in build stage
    - npm run build 
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
    

