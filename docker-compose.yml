services:
  woridge.frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        - NG_APP_API_URL=${NG_APP_API_URL}
        - NG_APP_NOTIF_URL=${NG_APP_NOTIF_URL}
    container_name: woridge-frontend
    ports:
      - "4200:80"
    networks:
      - woridge-external-network
    restart: unless-stopped

networks:
  woridge-external-network:
    external: true
      